            - `1` - $0 - 14,999
            - `2` - $15,000 - 19,999
            - `3` - $20,000 - 29,999
            - `4` - $30,000 - 39,999
            - `5` - $40,000 - 49,999
            - `6` - $50,000 - 74,999
            - `7` - $75,000 - 99,999

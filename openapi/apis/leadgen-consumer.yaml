                                ZIP type returns Zip plus 4.
                                City type returns county, state.
                                County type returns county, state.
                                State type returns state.
                                Street type returns street, city, state.
                                Radius type returns street, city, state.
                                Polygon type returns sets of polygon points with longitude and latitude.
                          ZIP:
                            type: string
                            description: For radius and street types only.
                          Count:
                            type: string
                            description: |
                              Number of records that &lt;StartNumber&gt;, &lt;EndNumber&gt;, &lt;Geography&gt;, and &lt;Zip&gt; apply to.
                Addresses:
                  type: object
                  description: |
                    Returned with geo type Street

                      * Only returned with Radius when strzip is specified.
                      * Contains a breakdown of the addresses returned.
                  properties:
                    Address:
                      type: array
                      description: When latitude and longitude are not requested for street count, this shows an address. Otherwise, it's a tag with sub tags to show details
                      items:
                        type: object
                        properties:
                          FullAddress:
                            type: array
                            description: An address when latitude and longitude are requested for street count
                          Latitude:
                            type: string
                            description: Latitude of the address when latitude and longitude are requested for street count
                          Longitude:
                            type: string
                            description: Longitude of the address when latitude and longitude are requested for street count
            TotalCount:
              type: object
              description: Total number of records returned with the selected options.
              properties:
                Count:
                  type: string
            Result:
              type: object
              description: Returns the status code.
              properties:
                StatusCode:
                  type: string
                  description: Indicates the status of a requests. Returns Declined, Approved, or Err.
    FileStatusRequest:
      type: object
      additionalProperties: false
      properties:
        Url:
          type: string
          description: Download link provided from the buy request.
        OrderId:
          type: string
          description: OrderId provided by the buy request.
    FileStatusResponse:
      type: object
      properties:
        url:
          type: string
        fileStatus:
          type: string
        orderTime:
          type: string
        finishTime:
          type: string
  responses:
    error:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: The type of error that occurred.
              title:
                type: string
                description: A short summary of the error.
              status:
                type: string
                description: The HTTP status code for the error.
              errors:
                type: object
                properties:
                  $.<PropertyName>:
                    type: array
                    description: A detailed message about the error.
                    items:
                      type: string
              traceId:
                type: string
                description: A unique identifier for the request, useful for debugging.
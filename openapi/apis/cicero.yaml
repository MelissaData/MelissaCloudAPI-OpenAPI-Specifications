        application/json:
          schema:
            type: object
            properties:
              response:
                $ref: '#/components/schemas/ResponseMap'
          example:
            response:
              errors: []
              messages: []
              results:
                maps:
                - extent:
                    x_min: -8963411.376635104
                    x_max: -8314397.281174287
                    y_min: 4797022.368711687
                    y_max: 5229698.432352231
                    srid: 3857
                  img_src: "data:image/png;base64,"
        application/xml:
          schema:
            $ref: '#/components/schemas/ResponseMap'
          example: |
            <response>
              <errors />
              <messages />
              <results>
                  <maps>
                      <map>
                          <extent>
                              <x_min>-8963411.376635104</x_min>
                              <x_max>-8314397.281174287</x_max>
                              <y_min>4797022.368711687</y_min>
                              <y_max>5229698.432352231</y_max>
                              <srid>3857</srid>
                          </extent>
                          <img_src>data:image/png;base64,</img_src>
                      </map>
                  </maps>
              </results>
            </response>
    error:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              response:

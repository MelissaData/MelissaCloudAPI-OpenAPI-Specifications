          - '*/*'
      example: application/json
    HeaderContentTypeParam:
      in: header
      name: Content-Type
      description: Format of the request.
      required: true
      schema:
        type: string
        enum: [application/json, application/xml]
    LicenseKeyParam:
      name: key
      in: query
      description: The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
      deprecated: true
      schema:
        type: string
        format: password
    CustomerIdParam:
      name: customer_id
      in: query
      description: Required. The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
      required: true
      schema:
        type: string
        format: password
      example: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
    FormatParam:
      name: format
      in: query
      description: Specify the desired format of the response.
      schema:
        type: string
        enum: [json, xml]
      example: json
  schemas:
    CountObject:

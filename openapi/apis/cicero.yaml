  /officials_by_region:
    get:
      tags:
        - Officials
      summary: Find elected officials by region
      description: |
        This resource provides the ability to list elected officials by level and region rather than for a single geographic location. The endpoint is filtered by district type and region, and sorted by `last_name`, `first_name`.

        Cost: 50 credits

        Permission: Please contact the Cicero Team to request access to this resource.
      operationId: officials_by_region
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - $ref: '#/components/parameters/FormatParam'
        - $ref: '#/components/parameters/CustomerIdParam'
        - $ref: '#/components/parameters/LicenseKeyParam'
        - name: district_type
          in: query
          description: Required. The type of district.
          required: true

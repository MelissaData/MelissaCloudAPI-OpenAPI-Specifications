paths:
  /official:
    get:
      tags:
        - Officials
      summary: Find elected officials
      description: |
        Cicero tracks elected officials and makes their information available through the official resource. The default response ordering is by `last_name`, `first_name`.

        Use location queries on this resource. You can also query for officials using the official's name.

        Cost: 1 credit
      operationId: official
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - $ref: '#/components/parameters/FormatParam'
        - $ref: '#/components/parameters/CustomerIdParam'
        - $ref: '#/components/parameters/LicenseKeyParam'
        - name: lat
          in: query
          description: Required. The latitude of the location.
          required: true
          schema:
            type: string
          example: '33.63756710910554'
        - name: lon
          in: query
          description: Required. The longitude of the location.
          required: true
          schema:
            type: string
          example: '-117.60695049134513'
        - name: search_loc
          in: query
          description: Required. One line address or a single search string.
          schema:
            type: string
        - name: search_address
          in: query
          description: Required. The street address of the location.
          schema:
            type: string
        - name: search_neighborhood
          in: query
          description: Required. The official neighborhood of the location (in countries with postal designations e.g., Mexico).
          schema:
            type: string
        - name: search_city
          in: query
          description: Required. The city of the location.
          schema:
            type: string
        - name: search_state
          in: query
          description: Required. The state of the location.
          schema:
            type: string
        - name: search_postal
          in: query
          description: Required. The postal code of the location.
          schema:
            type: string
        - name: search_country
          in: query
          description: Required. The country of the location (Use ISO 3166-1 alpha-2 code).
          schema:
            type: string
        - name: last_name
          in: query
          description: Required. The official's last name.
          schema:
            type: string
        - name: first_name
          in: query
          description: The official's first name.
          schema:
            type: string
        - name: city
          in: query
          description: The city of the location used as a filter.
          schema:
            type: string
        - name: state
          in: query
          description: The state of the location used as a filter.
          schema:
            type: string
        - name: country
          in: query
          description: The country of the location (Use ISO 3166-1 alpha-2 code) used as a filter.
          schema:
            type: string
        - name: order
          in: query
          description: The name of the resource field by which to order the results.
          schema:
            type: string
        - name: sort
          in: query
          description: Whether to sort the results in ascending or descending order.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: district_type
          in: query
          description: The type of district.
          schema:
            type: string
          example: NATIONAL_LOWER
        - name: district_id
          in: query
          description: The ID, number, or name of the official's district.
          schema:
            type: string
        - name: valid_on
          in: query
          description: The date the district is valid on. Date should be specified in a `YYYY-MM-DD` format.
          schema:
            type: string
        - name: valid_on_or_after
          in: query
          description: The date the district is valid on or after. Date should be specified in a `YYYY-MM-DD` format.
          schema:
            type: string
        - name: valid_on_or_before
          in: query
          description: The date the district is valid on or before. Date should be specified in a `YYYY-MM-DD` format.
          schema:
            type: string
        - name: valid_range
          in: query
          description: The dates during which the district is valid. Dates should be specified in a `YYYY-MM-DD` format and separated by a comma. Use `ALL` to return every district in all valid date ranges.
          schema:
            type: string
        - name: max
          in: query
          description: The maximum number of objects to return.
          schema:
            type: integer
            maximum: 200
            default: 40
        - name: offset
          in: query
          description: Number of items to skip in the response, starting from the beginning of the list.
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/ResponseOfficial'

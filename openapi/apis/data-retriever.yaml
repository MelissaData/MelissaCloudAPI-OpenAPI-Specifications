openapi: 3.0.3
info:
  version: ''
  title: Data Retriever
  description: |
    ## Overview ##
    The Data Retriever Cloud API allows you to generate, download, and access lists of contacts, addresses, businesses, and more.

    Data Retriever offers the following capabilities:
    - Retrieve a count of results based on provided filters, including City/State, Radius, Zip code, and polygon Shape.
    - Purchase a complete result set, navigate through the list of contacts and addresses using pagination.

    **Documentation**
    - [Data Retriever Documentation](https://docs.melissa.com/reference-data/data-retriever/data-retriever-index.html)

    **Useful Resources**
    - [GitHub](https://github.com/MelissaData/MelissaCloudAPI-OpenAPI-Specifications)
    - [Result Codes](https://docs.melissa.com/reference-data/data-retriever/data-retriever-reference-guide.html#result-codes)

    **Product Page**

    [https://www.melissa.com/data-retriever-cloud-api](https://www.melissa.com/data-retriever-cloud-api)

    **Support Center**

    [https://www.melissa.com/company/product-support](https://www.melissa.com/company/product-support)
security: []
tags:
  - name: MAK
    description: Use these endpoints to retrieve lists of addresses.
  - name: NewMovers
    description: Use these endpoints to retrieve lists of new movers.
  - name: NewHomeowners
    description: Use these endpoints to retrieve lists of new homeowners.
  - name: Consumer
    description: Use these endpoints to retrieve lists of consumers.
  - name: Consumer Two
    description: Use these endpoints to retrieve lists of consumers.
  - name: Business
    description: Use these endpoints to retrieve lists of businesses.
servers:
  - url: https://dataretriever.melissadata.net/web/V1
    description: Data Retriever Server
paths:
  /MAK/doCount:
    post:
      tags:
        - MAK
      summary: Get total record count of addresses
      operationId: doCountMak
      description: This endpoint gets the total record count returned using the required and optional properties passed in. This endpoint does not count against the package usage.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request_MAK_doCount'
            examples:
              example-zip:
                summary: Example request with Zips filter
                value:
                  CustomerID: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
                  Includes:
                    Zips:
                    - Zip: "92688"
                      Plus4: "2112"
                    RBDI:
                    - "B"
              example-cities:
                summary: Example request with Cities filter
                value:
                  CustomerID: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
                  Includes:
                    Cities:
                    - City: 'Rancho Santa Margarita'
                      State: 'CA'
                    - City: 'Irvine'
                      State: 'CA'
                    RBDI:
                    - "B"
              example-radius:
                summary: Example request with Radius filter
                value:
                  CustomerID: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
                  Includes:
                    Radius:
                      Latitude: 33.645
                      Longitude: -117.606
                      Distance: 2
                    RBDI:
                    - "B"
              example-shapeWKTs:
                summary: Example request with ShapeWKTs filter
                value:
                  CustomerID: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
                  Includes:
                    ShapeWKTs:
                      - "POLYGON((-117.63908729625203 33.54947105992495,-117.64000192952611 33.54939952783131,-117.6398195393131 33.548657378865364,-117.63903901648976 33.54871326379859,-117.63885394406773 33.548791502644384,-117.63875202012517 33.54936823252172,-117.63908729625203 33.54947105992495),(-117.63959372373107 33.54874903013689,-117.63959372373107 33.549088809612265,-117.63967687221053 33.549088809612265,-117.63967419000151 33.549370467901376,-117.63947034211638 33.54937270328092,-117.63936841817382 33.549048572638874,-117.63941133351805 33.54875126553252,-117.63959372373107 33.54874903013689))"
                    RBDI:
                      - "B"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_doCount'
              example:
                Count: 930
                JobId: "returned_job_id"
                ResultCode: "LS01"
        '400':
          $ref: '#/components/responses/error'
  /MAK/doLookup:
    post:
      tags:
        - MAK
      summary: Get a paginated result view of addresses
      operationId: doLookupMak
      description: This endpoint returns a paginated result view of the request. This can sometimes take awhile and should be used after DoCount has been used to filter down your dataset.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request_MAK_doLookup'
            example:
              CustomerID: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
              Includes:
                Zips:
                - Zip: "92688"
                RBDI:
                - "B"
              Columns:
                - MelissaAddressKey
                - AddressLine
                - Suite
              Pagination:
                Page: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_doLookup'
              example:
                Count: 930
                Results:
                  - MelissaAddressKey: 1007119866
                    AddressLine: "29911 Aventura"
                    Suite: ""
                  - MelissaAddressKey: 1008571286
                    AddressLine: "22362 Gilberto"
                    Suite: "Ste 121"
                Pagination:
                  CurrentPage: 1
                  NextPage: 2
                  TotalPages: 9
                JobId: "returned_job_id"
                ResultCode: "LS01"
        '400':
          $ref: '#/components/responses/error'
  /MAK/getCount:
    post:
      tags:
        - MAK
      summary: Get record count and sample of addresses
      operationId: getCountMak
      description: This endpoint allows API users to retrieve a count and 10 record sample of the results to preview before purchasing a file version of the full dataset.

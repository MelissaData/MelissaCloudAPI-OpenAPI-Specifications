  /ConsumerTwo/doLookup:
    post:
      tags:
        - Consumer Two
      summary: Get a paginated result view of consumers
      operationId: doLookupConsumerTwo
      description: This endpoint returns a paginated result view of the request. This can sometimes take awhile and should be used after DoCount has been used to filter down your dataset.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request_ConsumerTwo_doLookup'
            example:
              CustomerID: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
              Includes:
                Zips:
                - Zip: "92688"
                  CarrierRoute: "C057"
              Excludes:
                AddressStreetName:
                - ZipCode: "92688"
                  Street: "Arado"
              Columns:
                - MelissaAddressKey
                - AddressLine
                - RBDI
              Pagination:
                Page: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_doLookup'
              example:
                Count: 500
                Results:
                  - MelissaAddressKey: 1007278045
                    AddressLine: "139 Timbre"
                    RBDI: "R"
                  - MelissaAddressKey: 1021975246
                    AddressLine: "59 Timbre"
                    RBDI: "R"
                Pagination:
                  CurrentPage: 1
                  NextPage: 2
                  TotalPages: 5
                JobId: "returned_job_id"
                ResultCode: "LS01"
        '400':
          $ref: '#/components/responses/error'
  /ConsumerTwo/getCount:
    post:
      tags:
        - Consumer Two
      summary: Get record count and sample of consumers
      operationId: getCountConsumerTwo
      description: This endpoint allows API users to retrieve a count and 10 record sample of the results to preview before purchasing a file version of the full dataset.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:

        Options:
          type: string
          description: |
            [Options](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-reference-guide.html#options) - Specify which options to use for the selected action. List of options in `<OptionName>:<Parameter>` format. Multiple options are delimited with a `;`.

            For example: `OptionName:Parameter;OptionName:Parameter`.
            - `AdvancedAddressCorrection:< On | Off >` - Uses the name input to perform more advanced address corrections. This can correct or append house numbers, street names, cities, states, and ZIP codes. Default of `Off` means no advanced address corrections will occur.
            - `AdvancedAddressType:< On | Off >` - This option allows you to select whether to return the simplified address type codes or the advanced and more complete address type codes. Default of `Off` means only Default Address Types are returned (S, G, M, P, R, and U).
            - `AliasMode:< ConvertAlias | PreserveAlias >` - Option to convert an address to the USPS preferred street name or preserve the original address. Default of `ConvertAlias` will convert the street address alias to the USPS preferred street name.
            - `Append:< Blank | CheckError | Always >` - Determines the behavior when appending information. Default of `Blank` returns information only when the input field is blank.
            - `CentricHint:< Auto | Address | Phone | Email >` - This option tells the service which piece of information to use as the primary pivot when verifying information. Default of `Auto` first uses Address if available, followed by Phone if no Address is available, and lastly Email if neither Address nor Phone are available.
            - `CorrectFirstName:< On | Off >` - Default of `On` allows common spelling corrections for the FirstName field.
            - `CorrectSyntax:< On | Off >` - Default of `On` corrects the syntax of the Email field.
            - `DatabaseLookup:< On | Off >` - Default of `On` will attempt to verify domain names using a database of valid domains.
            - `DecennialCensusKey:< Off | 2020 | 2010 >` - Set the preferred Census information returned, whether the latest one or the decennial version. Default of `Off` returns the latest Census information available.
            - `Demographics:< Yes | Mask | MaskOnly | ValueOnly >` - Determines the data masking of demographics columns. Default of `Yes` means no data masking will be performed.
            - `Diacritics:< Auto | On | Off >` - Determines whether or not French language characters are returned. Default of `Auto` will only return those characters if they are in the input.
            - `EmailAppendFilter:< [blank] | CatchAll | SpamTrap >` - option to prevent certain categories of emails to append, including accept-all/catch-all emails and spam trap emails. Default of `[blank]` means no filtering will be done.
            - `FuzzyLookup:< On | Off >` - Determines whether or not to apply fuzzy matching algorithms to the input domain for correction. Default of `On` will apply fuzzy matching correction to the domain.
            - `GenderAggression:< Neutral | Conservative | Aggressive >` - Sets how aggressive genderization is for neutral first names. Default of `Neutral` sets gender aggression to neutral.
            - `GenderPopulation:< Mixed | Male | Female >` - Sets the gender balance of the source data, either predominantly male, female, or mixed (evenly split). Default of `Mixed` sets source data gender balance to mixed.
            - `LongAddressFormat:< Off | On | Auto >` - Controls how abbreviations of suffixes and directionals are handled when standardizing a street address. Default of `Off` will abbreviate suffixes and directionals.
            - `MiddleNameLogic:< ParseLogic | HypenatedLast | MiddleName >` - Determines the handling of middle names. Default of `ParseLogic` means that middle names that are typically last names are considered to be part of a hyphenated last name.
            - `NameHint:< Varying | DefinitelyFull | VeryLikelyFull | ProbablyFull | ProbablyInverse | VeryLikelyInverse | DefinitelyInverse | MixedFirstName | MixedLastName >` - Sets the name hint for the input name. Default of `Varying` means if necessary, statistical logic will be employed to determine name order, with no bias toward either name order.
            - `SalutationFormat:< Formal | Informal | FirstLast >` - Sets the salutation format for the response. Default of `Formal` Sets the salutation format to formal.
            - `StandardizeCasing:< On | Off >` - Determines whether to standardize casing in the email field before any checking occurs. Default of `On` will standardize all letters to lower case.
            - `StandardizeCompany:< On | Off >` - Determines whether to standardize the CompanyName field. Default of `On` will perform standard abbreviation, capitalization, and punctuation on the CompanyName field.
            - `UpdateDomain:< On | Off >` - Determines whether to update the domain name. Default of `On` will update the domain if it is out of date.
            - `UsePreferredCity:< Off | On >` - Determines whether to substitute the preferred city name for all vanity names when verifying an address. Default of `Off` means no substitution will occur.
        Records:
          type: array
          minItems: 1
          maxItems: 100
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/RequestRecord'
    RequestRecord:
      type: object
      xml:
          name: RequestRecord
      additionalProperties: false
      properties:
        AddressLine1:
          type: string
          description: The input field for the address line 1.
        AddressLine2:
          type: string
          description: The input field for the address line 2.
        AgeApproximate:
          type: string
          description: Filter results to return individuals who are within a year of the provided age.
        AgeGreaterThan:
          type: string
          description: Filter results to return individuals whose age is greater than the provided age.
        AgeLessThan:
          type: string
          description: Filter results to return individuals whose age is less than the provided age.
        BirthDay:
          type: string
          description: The birth day of the contact record in `DD` format.
        BirthMonth:
          type: string
          description: The birth month of the contact record in `MM` format.
        BirthYear:
          type: string
          description: The birth year of the contact record in `YYYY` format.
        City:
          type: string
          description: The city name.
        CompanyName:
          type: string
          description: The company name.
        Country:
          type: string
          description: The country. This can only take in variations of US or Canada. All other countries will return AS09 (Foreign Address). Invalid or blank inputs will default to US and Canada.
        EmailAddress:
          type: string
          description: The email address.
        FirstName:
          type: string
          description: The given (first) name.
        Format:
          type: string
          description: The format of the response.
        FreeForm:
          type: string
          description: The delimited or undelimited free form input that will be parsed by the service.
        FullName:
          type: string
          description: The full name. Name parsing will only happen if the first name and last name fields are blank.
        IPAddress:
          type: string
          description: The IP Address for the record.
        LastLine:
          type: string
          description: 	The city, state, and ZIP.
        LastName:
          type: string
          description: The family (last) name.
        MelissaAddressKey:
          type: string
          description: A proprietary unique key identifier for an address.
        MIK:
          type: string
          description: The input field for the Melissa Identity Key, a unique number for each individual.
        PhoneNumber:
          type: string
          description: The phone number.
        PostalCode:
          type: string
          description: The postal or ZIP Code.
        RecordID:
          type: string
          description: A unique identifier for the current record.
        State:
          type: string
          description: The US state.
    Response:
      type: object
      xml:
          name: Response
      properties:
        TotalRecords:
          type: string
          description: Total number of records.
        TransmissionReference:
          type: string
          description: A pass-through of the input TransmissionReference field.
        TransmissionResults:
          type: string
          description: Lists error codes from any errors caused by the most recent request as a whole. For more information, see [Personator Consumer Result Codes](https://docs.melissa.com/cloud-api/personator-consumer/result-codes.html).
        Version:
          type: string
          description: The current service version number.
        Records:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/ResponseRecord'
    ResponseRecord:
      type: object
      xml:
          name: ResponseRecord
      properties:
        AddressExtras:
          type: string
          description: Any extra information that does not fit in the AddressLine fields.
        AddressKey:
          type: string
          description: Returns a unique identifier for an address. This key can be used with other current and future Melissa services.
        AddressLine1:
          type: string
          description: Returns the address entered in the AddressLine field. If two addresses were entered and only one is valid, the valid address is returned instead. This includes the suite and private mailbox.
        AddressLine2:
          type: string
          description: If two addresses are passed into the AddressLine field, the second address is returned here. If only one of two addresses is valid, the valid address will be returned in AddressLine1.
        City:
          type: string
          description: Returns the city entered in the City field.
        CompanyName:
          type: string
          description: Returns the company name.
        EmailAddress:
          type: string
          description: Returns the email address entered in the Email field.
        MelissaAddressKey:
          type: string
          description: Returns a unique key associated with an address.
        MelissaAddressKeyBase:
          type: string
          description: Returns a unique key associated with a building containing multiple suites/apartments.
        NameFull:
          type: string
          description: Returns the full name for the record.
        PhoneNumber:
          type: string
          description: Returns the standardized phone number for the record.
        PostalCode:
          type: string
          description: Returns the 9-digit postal code for U.S. addresses and 6-digit postal code for Canadian addresses.
        RecordID:
          type: string
          description: Returns a unique identifier for the current record if one was sent in the request. Use this element to match a request record and the corresponding response record.
        Results:
          type: string
          description: Returns a string value with comma delimited status, error codes, and change codes for the record. For more information, see [Personator Consumer Result Codes](https://docs.melissa.com/cloud-api/personator-consumer/result-codes.html).
        State:
          type: string
          description: Returns the state for the record
        DateLastConfirmed:
          type: string
          description: Returns the date this record was last seen updated from one of Personator's Data Sources.
        EstimatedHomeValue:
          type: string
          description: The estimated value of the home, given in U.S. Dollars.
        MelissaIdentityKey:
          type: string
          description: |
            Returns a unique key associated with an individual. In order to retrieve the MelissaIdentityKey, the Check and Verify Actions must both be enabled: `"Actions":"Check,Verify"`
        MoveDate:
          type: string
          description: Returns the date associated with the move address.
        Occupation:
          type: string
          enum:
            - Physician/Dentist
            - Healthcare
            - Lawyer/Judge
            - Professional/Technical
            - Management
            - Teacher/Educator
            - Sales/Marketing
            - Clerical/Service Worker
            - Tradesmen/Laborer
            - Farmer
            - Student
            - Homemaker
            - Retired
            - Federal Employee
            - Military
            - Military Retired
            - Business Owner
            - Religious
            - Self Employed
            - Financial
            - Other
          description: Returns the category for the individual's occupation.
        OwnRent:
          type: string
          enum:
            - Definite Renter
            - Inferred Renter
            - Inferred Owner
            - Definite Owner
          description: Returns the individual's status as owner or renter of the property.
        PhoneCountryCode:
          type: string
          description: Returns the 2 character country code for the phone number entered in the Phone field.
        PhoneCountryName:
          type: string
          description: Returns the full country name for the phone number entered in the Phone field.
        Plus4:
          type: string
          description: Returns the 4-digit plus4 for the input address. If this column is requested, the PostalCode field will only contain the 5-digit ZIP for U.S. addresses.
        PrivateMailBox:
          type: string
          description: Returns the private mail box number for the address in the AddressLine field, if any. Private mailboxes are private mail boxes in commercial mail receiving agencies, like a UPS Store. If requested, the Private mailbox will be populated in this field instead of the Address field.
        Suite:
          type: string
          description: Returns the suite for the address in the AddressLine field, if any. If requested, the suite will be populated in this field instead of the Address field.
        AddressTypeCode:
          type: string
          description: Returns a code for the address type in the AddressLine field. For more information, see [Personator Consumer Result Codes](https://docs.melissa.com/cloud-api/personator-consumer/result-codes.html).
        CarrierRoute:
          type: string
          description: Returns a 4-character code defining the carrier route for this record.
        CityAbbreviation:
          type: string
          description: Returns an abbreviation for the city entered in the City field, if any.
        CountryCode:
          type: string
          description: Returns the country code for the country in the Country field.
        CountryName:
          type: string
          description: Returns the country name for the record.
        DeliveryIndicator:
          type: string
          enum: [B, R, U]
          description: Returns an indicator of whether an address is a business address or residential address.
        DeliveryPointCheckDigit:
          type: string
          description: Returns a string value containing the 1-digit delivery point check digit.
        DeliveryPointCode:
          type: string
          description: Returns a string value containing the 2-digit delivery point code.
        StateName:
          type: string
          description: Returns the full name of the state entered in the State field.
        UrbanizationName:
          type: string
          description: Returns the urbanization name for the address entered in the AddressLine field. Usually only used if the address is in Puerto Rico.
        UTC:
          type: string
          description: Returns the time zone of the requested record. All Melissa products express time zones in UTC (Coordinated Universal Time).
        CBSACode:
          type: string
          description: Census Bureau's Core Based Statistical Area (CBSA). Returns the 5-digit code for the CBSA associated with the requested record.
        CBSADivisionCode:
          type: string
          description: Returns the code for a division associated with the requested record, if any.
        CBSADivisionLevel:
          type: string
          description: Returns whether the CBSA division, if any, is metropolitan or micropolitan.
        CBSADivisionTitle:
          type: string
          description: Returns the title for the CBSA division, if any.
        CBSALevel:
          type: string
          description: Returns whether the CBSA is metropolitan or micropolitan.
        CBSATitle:
          type: string
          description: Returns the title for the CBSA.
        CensusBlock:
          type: string
          description: Returns a 4-digit string containing the census block number associated with the requested record.
        CensusTract:
          type: string
          description: Returns a 4-to 6-digit string containing the census tract number associated with the requested record. Census tracts are small subdivisions of a county.
        CongressionalDistrict:
          type: string
          description: Returns the 2-digit congressional district that the requested record belongs to.
        CountyFIPS:
          type: string
          description: Returns the FIPS code for the county in the County field.
        CountyName:
          type: string
          description: Returns the county name.
        PlaceCode:
          type: string
          description: When ZIP codes overlap, the City field will always return the city that covers most of the ZIP area. If the address is located outside of that city but within the ZIP Code, PlaceCode/PlaceName will refer to that area.
        PlaceName:
          type: string
          description: When ZIP codes overlap, the City field will always return the city that covers most of the ZIP area. If the address is located outside of that city but within the ZIP Code, PlaceCode/PlaceName will refer to that area.
        CensusKey:
          type: string
          description: Returns a 15 digit string containing the concatenated County FIPS, Census Tract and Census Block.
        CountySubdivisionCode:
          type: string
          description: Returns a 5 digit string representing the County Subdivision Code for the requested record.
        CountySubdivisionName:
          type: string
          description: Returns the County Subdivision Name for the requested record.

openapi: 3.0.3
info:
  version: ''
  title: Personator Consumer
  description: |
    ## Overview ##
    The Personator Consumer Cloud API provides CASS/DPV certified Address Verification and optionally leverages comprehensive Consumer data for all-in-one email, phone, name checking, name to address verification, move update, and appending missing information, demographics, enrichments.

    Personator Consumer can be used to:
    - Verify, Correct, & Standardize names, addresses, phones and emails
    - Retrieve move information
    - Append demographics
    - Append Geographic and Census data

    **Documentation**
    - [Personator Consumer Documentation](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-index.html)

    **Useful Resources**
    - [GitHub](https://github.com/MelissaData/MelissaCloudAPI-OpenAPI-Specifications)
    - [Release Notes](https://releasenotes.melissa.com/cloud-api/personator-consumer/)
    - [Result Codes](https://docs.melissa.com/cloud-api/personator-consumer/result-codes.html)

    **Product Page**

    [https://www.melissa.com/personator-consumer](https://www.melissa.com/personator-consumer)

    **Support Center**

    [https://www.melissa.com/company/product-support](https://www.melissa.com/company/product-support)

security: []
tags:
  - name: Consumer Verification
    description: Use this endpoint to do contact verification.
servers:
  - url: https://personator.melissadata.net/v3/WEB/ContactVerify
    description: Personator Consumer Server
paths:
  /doContactVerify:
    get:
      tags:
        - Consumer Verification
      summary: Verify a consumer
      description: |
        The service requires at least one of the following input combinations:

        **Set A** - `a1`, `postal`

        **Set B** - `a1`, `city`, `state`

        **Set C** - `a1`, `lastline`

        **Set D** - `email`

        **Set E** - `phone`

        **Set F** - `full`

        **Set G** - `ip`

        **Set H** - `ff`

        **Set I** - `mak`

        **Set J** - `mik`

        **Note**: The minimum input requirements differ depending on the Action(s) selected. Please check the [documentation](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-faq.html#minimum-input-requirements) for more details.

      operationId: doContactVerifyGET
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - $ref: '#/components/parameters/ActionsParam'
        - $ref: '#/components/parameters/ColumnsParam'
        - $ref: '#/components/parameters/LicenseKeyParam'
        - $ref: '#/components/parameters/OptionsParam'
        - $ref: '#/components/parameters/TransmissionReferenceParam'
        - $ref: '#/components/parameters/AddressLine1Param'
        - $ref: '#/components/parameters/AddressLine2Param'
        - $ref: '#/components/parameters/AgeApproximateParam'
        - $ref: '#/components/parameters/AgeGreaterThanParam'
        - $ref: '#/components/parameters/AgeLessThanParam'
        - $ref: '#/components/parameters/BirthDayParam'
        - $ref: '#/components/parameters/BirthMonthParam'
        - $ref: '#/components/parameters/BirthYearParam'
        - $ref: '#/components/parameters/CityParam'
        - $ref: '#/components/parameters/CompanyNameParam'
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/EmailAddressParam'
        - $ref: '#/components/parameters/FirstNameParam'
        - $ref: '#/components/parameters/FormatParam'
        - $ref: '#/components/parameters/FreeFormParam'
        - $ref: '#/components/parameters/FullNameParam'
        - $ref: '#/components/parameters/IPAddressParam'
        - $ref: '#/components/parameters/LastLineParam'
        - $ref: '#/components/parameters/LastNameParam'
        - $ref: '#/components/parameters/MelissaAddressKeyParam'
        - $ref: '#/components/parameters/MelissaIdentityKeyParam'
        - $ref: '#/components/parameters/PhoneNumberParam'
        - $ref: '#/components/parameters/PostalCodeParam'
        - $ref: '#/components/parameters/StateParam'
      responses:
        '200':
          $ref: '#/components/responses/successGet'
        '400':
          $ref: '#/components/responses/error'

    post:
      tags:
        - Consumer Verification
      summary: Verify consumers
      operationId: doContactVerifyPOST
      description: |
        Submit a batch request to verify consumers.

        The service requires at least one of the following input combinations:

        **Set A** - `AddressLine1`, `PostalCode`

        **Set B** - `AddressLine1`, `City`, `State`

        **Set C** - `AddressLine1`, `LastLine`

        **Set D** - `EmailAddress`

        **Set E** - `PhoneNumber`

        **Set F** - `FullName`

        **Set G** - `IPAddress`

        **Set H** - `FreeForm`

        **Set I** - `MelissaAddressKey`

        **Set J** - `MelissaIdentityKey`

        **Note**: The minimum input requirements differ depending on the Action(s) selected. Please check the [documentation](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-faq.html#minimum-input-requirements) for more details.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
            example:
              Actions: Append
              Columns: ""
              CustomerID: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
              Options: "Append:blank"
              TransmissionReference: Test
              Records:
                - AddressLine1: "22382 Avenida Empresa"
                  AddressLine2: ""
                  BirthDay: ""
                  BirthMonth: ""
                  BirthYear: ""
                  City: "Rancho Santa Margarita"
                  CompanyName: ""
                  Country: ""
                  EmailAddress: ""
                  FirstName: ""
                  Format: "JSON"
                  FreeForm: ""
                  FullName: ""
                  IPAddress: ""
                  LastLine: ""
                  LastName: ""
                  MelissaAddressKey: ""
                  MIK: ""
                  PhoneNumber: ""
                  PostalCode: ""
                  RecordID: "1"
                  State: "California"
                - AddressLine1: ""
                  AddressLine2: ""
                  BirthDay: ""
                  BirthMonth: ""
                  BirthYear: ""
                  City: ""
                  CompanyName: ""
                  Country: ""
                  EmailAddress: ""
                  FirstName: ""
                  Format: "JSON"
                  FreeForm: ""
                  FullName: ""
                  IPAddress: ""
                  LastLine: ""
                  LastName: ""
                  MelissaAddressKey: ""
                  MIK: ""
                  PhoneNumber: ""
                  PostalCode: ""
                  RecordID: "2"
                  State: ""
          application/xml:
            schema:
              $ref: '#/components/schemas/Request'
            example: |
              <Request>
                <Actions>Append</Actions>
                <Columns></Columns>
                <CustomerID>{REPLACE-WITH-YOUR-LICENSE-KEY}</CustomerID>
                <Options>Append:blank</Options>
                <Records>
                    <RequestRecord>
                      <AddressLine1>22382 Avenida Empresa</AddressLine1>
                      <AddressLine2></AddressLine2>
                      <BirthDay></BirthDay>
                      <BirthMonth></BirthMonth>
                      <BirthYear></BirthYear>
                      <City>Rancho Santa Margarita</City>
                      <CompanyName></CompanyName>
                      <Country></Country>
                      <EmailAddress></EmailAddress>
                      <FirstName></FirstName>
                      <FreeForm></FreeForm>
                      <FullName></FullName>
                      <IPAddress></IPAddress>
                      <LastLine></LastLine>
                      <LastName></LastName>
                      <MelissaAddressKey></MelissaAddressKey>
                      <PhoneNumber></PhoneNumber>
                      <PostalCode></PostalCode>
                      <RecordID>1</RecordID>
                      <State>California</State>
                    </RequestRecord>
                    <RequestRecord>
                      <AddressLine1></AddressLine1>
                      <AddressLine2></AddressLine2>
                      <BirthDay></BirthDay>
                      <BirthMonth></BirthMonth>
                      <BirthYear></BirthYear>
                      <City></City>
                      <CompanyName></CompanyName>
                      <Country></Country>
                      <EmailAddress></EmailAddress>
                      <FirstName></FirstName>
                      <FreeForm></FreeForm>
                      <FullName></FullName>
                      <IPAddress></IPAddress>
                      <LastLine></LastLine>
                      <LastName></LastName>
                      <MelissaAddressKey></MelissaAddressKey>
                      <PhoneNumber></PhoneNumber>
                      <PostalCode></PostalCode>
                      <RecordID>2</RecordID>
                      <State></State>
                    </RequestRecord>
                </Records>
                <TransmissionReference>Test</TransmissionReference>
              </Request>
      responses:
        '200':
          $ref: '#/components/responses/successPost'
        '400':
          $ref: '#/components/responses/error'
components:
  parameters:
    HeaderAcceptParam:
      in: header
      name: Accept
      description: Format of the response.
      required: true
      schema:
        type: string
        enum:
          - 'application/json'
          - '*/*'
      example: application/json
    HeaderContentTypeParam:
      in: header
      name: Content-Type
      description: Format of the request.
      required: true
      schema:
        type: string
        enum: [application/json, application/xml]
    TransmissionReferenceParam:
      name: t
      in: query
      example: "Test"
      description: Transmission Reference - Serves as a unique identifier for this set of records.
      schema:
        type: string
    LicenseKeyParam:
      name: id
      in: query
      example: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
      description: Required. The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
      required: true
      schema:
        format: password
    FormatParam:
      name: format
      in: query
      example: "JSON"
      description: Format of the request.
      schema:
        type: string
        enum: [json, xml]
    ActionsParam:
      name: act
      in: query
      example: "Append"
      description: |
            [Actions](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-reference-guide.html#actions) - The action(s) to take. Delimit multiple actions with a `,`.
      required: true
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [Check, Verify, Move, Append]
    ColumnsParam:
      name: cols
      in: query
      description: |
        [Columns](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-reference-guide.html#columns) - The column names or groups to be output.

        Entering the column name will return the column. Specifying a group name will return all columns in the group.

        Delimit multiple columns with a `,`.

        For example: `ColumnName,ColumnName`.

        Columns:

            <details>
            <summary> [No Group] - These fields have no group and have to be requested by the field name. </summary>

              - `DateLastConfirmed`
              - `EstimatedHomeValue`
              - `MelissaIdentityKey`
              - `MoveDate`
              - `Occupation`
              - `OwnRent`
              - `PhoneCountryCode`
              - `PhoneCountryName`
              - `Plus4`
              - `PrivateMailBox`
              - `Suite`

            </details>
            <details>
            <summary> <code>GrpAddressDetails</code> - Address Details </summary>

              - `AddressTypeCode`
              - `CarrierRoute`
              - `CityAbbreviation`
              - `CountryCode`
              - `CountryName`
              - `DeliveryIndicator`
              - `DeliveryPointCheckDigit`
              - `DeliveryPointCode`
              - `StateName`
              - `UrbanizationName`
              - `UTC`

            </details>
            <details>
            <summary> <code>GrpCensus</code> - Census Details </summary>

              - `CBSACode`
              - `CBSADivisionCode`
              - `CBSADivisionLevel`
              - `CBSADivisionTitle`
              - `CBSALevel`
              - `CBSATitle`
              - `CensusBlock`
              - `CensusTract`
              - `CongressionalDistrict`
              - `CountyFIPS`
              - `CountyName`
              - `PlaceCode`
              - `PlaceName`

            </details>
            <details>
            <summary> <code>GrpCensus2</code> - Additional Census Details </summary>

              - `CensusKey`
              - `CountySubdivisionCode`
              - `CountySubdivisionName`
              - `ElementarySchoolDistrictCode`
              - `ElementarySchoolDistrictName`
              - `SecondarySchoolDistrictCode`
              - `SecondarySchoolDistrictName`
              - `UnifiedSchoolDistrictCode`
              - `UnifiedSchoolDistrictName`
              - `StateDistrictUpper`
              - `StateDistrictLower`

            </details>
            <details>
            <summary> <code>GrpGeocode</code> - Geocode Details </summary>

              - `Latitude`
              - `Longitude`

            </details>
            <details>
            <summary> <code>GrpDemographicBasic</code> - Basic Demographics </summary>

              - `ChildrenAgeRange`
              - `CreditCardUser`
              - `DateOfBirth`
              - `DateOfDeath`
              - `DemographicsGender`
              - `DemographicsResults`
              - `Education`
              - `EthnicCode` (Deprecated)
              - `EthnicGroup` (Deprecated)
              - `HouseholdIncome`
              - `HouseholdSize`
              - `LengthOfResidence`
              - `MaritalStatus`
              - `MedianHouseholdIncome`
              - `PoliticalParty`
              - `PresenceOfChildren`
              - `PresenceOfSenior`

            </details>
            <details>
            <summary> <code>GrpIPAddress</code> - IP Address Details </summary>

              - `DistanceAddressToIP`
              - `IPAddress`
              - `IPCity`
              - `IPConnectionSpeed`
              - `IPConnectionType`
              - `IPContinent`
              - `IPCountryAbbreviation`
              - `IPCountryName`
              - `IPDomainName`
              - `IPISPName`
              - `IPLatitude`
              - `IPLongitude`
              - `IPPostalCode`
              - `IPProxyDescription`
              - `IPProxyType`
              - `IPRegion`
              - `IPUTC`

            </details>
            <details>
            <summary> <code>GrpNameDetails</code> - Name Details </summary>

              - `Gender`
              - `Gender2`
              - `NameFirst`
              - `NameFirst2`
              - `NameLast`
              - `NameLast2`
              - `NameMiddle`
              - `NameMiddle2`
              - `NamePrefix`
              - `NamePrefix2`
              - `NameSuffix`
              - `NameSuffix2`
              - `Salutation`

            </details>
            <details>
            <summary> <code>GrpParsedAddress</code> - Parsed Address Details </summary>

              - `AddressDeliveryInstallation`
              - `AddressHouseNumber`
              - `AddressLockBox`
              - `AddressPostDirection`
              - `AddressPreDirection`
              - `AddressPrivateMailboxName`
              - `AddressPrivateMailboxRange`
              - `AddressRouteService`
              - `AddressStreetName`
              - `AddressStreetSuffix`
              - `AddressSuiteName`
              - `AddressSuiteNumber`

            </details>
            <details>
            <summary> <code>GrpParsedEmail</code> - Parsed Email Details </summary>

              - `DomainName`
              - `MailboxName`
              - `TopLevelDomain`

            </details>
            <details>
            <summary> <code>GrpParsedPhone</code> - Parsed Phone Details </summary>

              - `AreaCode`
              - `NewAreaCode`
              - `PhoneExtension`
              - `PhonePrefix`
              - `PhoneSuffix`

            </details>
      schema:
        type: string
    OptionsParam:
      name: opt
      in: query
      example: "Append:blank"
      description: |
        [Options](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-reference-guide.html#options) - Specify which options to use for the selected action. List of options in `<OptionName>:<Parameter>` format. Multiple options are delimited with a `;`.

        For example: `OptionName:Parameter;OptionName:Parameter`.
        - `AdvancedAddressCorrection:< On | Off >` - Uses the name input to perform more advanced address corrections. This can correct or append house numbers, street names, cities, states, and ZIP codes. Default of `Off` means no advanced address corrections will occur.
        - `AdvancedAddressType:< On | Off >` - This option allows you to select whether to return the simplified address type codes or the advanced and more complete address type codes. Default of `Off` means only Default Address Types are returned (S, G, M, P, R, and U).
        - `AliasMode:< ConvertAlias | PreserveAlias >` - Option to convert an address to the USPS preferred street name or preserve the original address. Default of `ConvertAlias` will convert the street address alias to the USPS preferred street name.
        - `Append:< Blank | CheckError | Always >` - Determines the behavior when appending information. Default of `Blank` returns information only when the input field is blank.
        - `CentricHint:< Auto | Address | Phone | Email >` - This option tells the service which piece of information to use as the primary pivot when verifying information. Default of `Auto` first uses Address if available, followed by Phone if no Address is available, and lastly Email if neither Address nor Phone are available.
        - `CorrectFirstName:< On | Off >` - Default of `On` allows common spelling corrections for the FirstName field.
        - `CorrectSyntax:< On | Off >` - Default of `On` corrects the syntax of the Email field.
        - `DatabaseLookup:< On | Off >` - Default of `On` will attempt to verify domain names using a database of valid domains.
        - `DecennialCensusKey:< Off | 2020 | 2010 >` - Set the preferred Census information returned, whether the latest one or the decennial version. Default of `Off` returns the latest Census information available.
        - `Demographics:< Yes | Mask | MaskOnly | ValueOnly >` - Determines the data masking of demographics columns. Default of `Yes` means no data masking will be performed.
        - `Diacritics:< Auto | On | Off >` - Determines whether or not French language characters are returned. Default of `Auto` will only return those characters if they are in the input.
        - `EmailAppendFilter:< [blank] | CatchAll | SpamTrap >` - option to prevent certain categories of emails to append, including accept-all/catch-all emails and spam trap emails. Default of `[blank]` means no filtering will be done.
        - `FuzzyLookup:< On | Off >` - Determines whether or not to apply fuzzy matching algorithms to the input domain for correction. Default of `On` will apply fuzzy matching correction to the domain.
        - `GenderAggression:< Neutral | Conservative | Aggressive >` - Sets how aggressive genderization is for neutral first names. Default of `Neutral` sets gender aggression to neutral.
        - `GenderPopulation:< Mixed | Male | Female >` - Sets the gender balance of the source data, either predominantly male, female, or mixed (evenly split). Default of `Mixed` sets source data gender balance to mixed.
        - `LongAddressFormat:< Off | On | Auto >` - Controls how abbreviations of suffixes and directionals are handled when standardizing a street address. Default of `Off` will abbreviate suffixes and directionals.
        - `MiddleNameLogic:< ParseLogic | HypenatedLast | MiddleName >` - Determines the handling of middle names. Default of `ParseLogic` means that middle names that are typically last names are considered to be part of a hyphenated last name.
        - `NameHint:< Varying | DefinitelyFull | VeryLikelyFull | ProbablyFull | ProbablyInverse | VeryLikelyInverse | DefinitelyInverse | MixedFirstName | MixedLastName >` - Sets the name hint for the input name. Default of `Varying` means if necessary, statistical logic will be employed to determine name order, with no bias toward either name order.
        - `SalutationFormat:< Formal | Informal | FirstLast >` - Sets the salutation format for the response. Default of `Formal` Sets the salutation format to formal.
        - `StandardizeCasing:< On | Off >` - Determines whether to standardize casing in the email field before any checking occurs. Default of `On` will standardize all letters to lower case.
        - `StandardizeCompany:< On | Off >` - Determines whether to standardize the CompanyName field. Default of `On` will perform standard abbreviation, capitalization, and punctuation on the CompanyName field.
        - `UpdateDomain:< On | Off >` - Determines whether to update the domain name. Default of `On` will update the domain if it is out of date.
        - `UsePreferredCity:< Off | On >` - Determines whether to substitute the preferred city name for all vanity names when verifying an address. Default of `Off` means no substitution will occur.
      schema:
        type: string
    FirstNameParam:
      name: first
      in: query
      description: First Name.
      schema:
        type: string
    LastNameParam:
      name: last
      in: query
      description: Last Name.
      schema:
        type: string
    FullNameParam:
      name: full
      in: query
      description: 	Full Name - Name parsing will only happen if the first name and last name fields are blank.
      schema:
        type: string
    CompanyNameParam:
      name: comp
      in: query
      description: Company Name.
      schema:
        type: string
    AddressLine1Param:
      name: a1
      in: query
      required: true
      example: "22382 Avenida Empresa"
      description: Address Line 1.
      schema:
        type: string
    AddressLine2Param:
      name: a2
      in: query
      description: Address Line 2.
      schema:
        type: string
    CityParam:
      name: city
      in: query
      required: true
      example: "Rancho Santa Margarita"
      description: City Name.
      schema:
        type: string
    StateParam:
      name: state
      in: query
      required: true
      example: "California"
      description: US State.
      schema:
        type: string
    PostalCodeParam:
      name: postal
      in: query
      description: Postal or ZIP Code.
      schema:
        type: string
    CountryParam:
      name: ctry
      in: query
      description: Country - This can only take in variations of US or Canada. All other countries will return AS09 (Foreign Address). Invalid or blank inputs will default to US and Canada.
      schema:
        type: string
    LastLineParam:
      name: lastline
      in: query
      description: 	The city, state, and ZIP.
      schema:
        type: string
    EmailAddressParam:
      name: email
      in: query
      description: Email Address.
      schema:
        type: string
    PhoneNumberParam:
      name: phone
      in: query
      description: Phone Number.
      schema:
        type: string
    FreeFormParam:
      name: ff
      in: query
      description: FreeForm - The delimited or undelimited free form input that will be parsed by the service.
      schema:
        type: string
    MelissaAddressKeyParam:
      name: mak
      in: query
      description: Melissa Address Key - A proprietary unique key identifier for an address.
      schema:
        type: string
    MelissaIdentityKeyParam:
      name: mik
      in: query
      description: Melissa Identity Key - A unique number for each individual.
      schema:
        type: string
    IPAddressParam:
      name: ip
      in: query
      description: IP Address.
      schema:
        type: string
    BirthDayParam:
      name: bday
      in: query
      description: 	Birth Day - In `DD` format.
      schema:
        type: string
    BirthMonthParam:
      name: bmo
      in: query
      description: Birth Month - In `MM` format.
      schema:
        type: string
    BirthYearParam:
      name: byr
      in: query
      description: Birth Year - In `YYYY` format.
      schema:
        type: string
    AgeApproximateParam:
      name: ageapprox
      in: query
      description: Age Approximate - Filter results to return individuals who are within a year of the provided age.
      schema:
        type: string
    AgeGreaterThanParam:
      name: agegt
      in: query
      description: Age Greater Than - Filter results to return individuals whose age is greater than the provided age.
      schema:
        type: string
    AgeLessThanParam:
      name: agelt
      in: query
      description: Age Less Than - Filter results to return individuals whose age is less than the provided age.
      schema:
        type: string
  schemas:
    Request:
      xml:
          name: Request
      type: object
      additionalProperties: false
      required:
        - CustomerID
        - Actions
        - Records
      properties:
        TransmissionReference:
          type: string
          description: Serves as a unique request identifier.
        CustomerID:
          type: string
          description: Required. The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
        Actions:
          type: string
          enum: [Check, Verify, Move, Append]
          description: |
            [Actions](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-reference-guide.html#actions) - The action(s) to take. Delimit multiple actions with a `,`.
        Columns:
          type: string
          description: |
            [Columns](https://docs.melissa.com/cloud-api/personator-consumer/personator-consumer-reference-guide.html#columns) - The column names or groups to be output.

            Entering the column name will return the column. Specifying a group name will return all columns in the group.

            Delimit multiple columns with a `,`.

            For example: `ColumnName,ColumnName`.

            Columns:

                <details>
                <summary> [No Group] - These fields have no group and have to be requested by the field name. </summary>

                  - `DateLastConfirmed`
                  - `EstimatedHomeValue`
                  - `MelissaIdentityKey`
                  - `MoveDate`
                  - `Occupation`
                  - `OwnRent`
                  - `PhoneCountryCode`
                  - `PhoneCountryName`
                  - `Plus4`
                  - `PrivateMailBox`
                  - `Suite`

                </details>
                <details>
                <summary> <code>GrpAddressDetails</code> - Address Details </summary>

                  - `AddressTypeCode`
                  - `CarrierRoute`
                  - `CityAbbreviation`
                  - `CountryCode`
                  - `CountryName`
                  - `DeliveryIndicator`
                  - `DeliveryPointCheckDigit`
                  - `DeliveryPointCode`
                  - `StateName`
                  - `UrbanizationName`
                  - `UTC`

                </details>
                <details>
                <summary> <code>GrpCensus</code> - Census Details </summary>

                  - `CBSACode`
                  - `CBSADivisionCode`
                  - `CBSADivisionLevel`
                  - `CBSADivisionTitle`
                  - `CBSALevel`
                  - `CBSATitle`
                  - `CensusBlock`
                  - `CensusTract`
                  - `CongressionalDistrict`
                  - `CountyFIPS`
                  - `CountyName`
                  - `PlaceCode`
                  - `PlaceName`

                </details>
                <details>
                <summary> <code>GrpCensus2</code> - Additional Census Details </summary>

                  - `CensusKey`
                  - `CountySubdivisionCode`
                  - `CountySubdivisionName`
                  - `ElementarySchoolDistrictCode`
                  - `ElementarySchoolDistrictName`
                  - `SecondarySchoolDistrictCode`
                  - `SecondarySchoolDistrictName`
                  - `UnifiedSchoolDistrictCode`
                  - `UnifiedSchoolDistrictName`
                  - `StateDistrictUpper`
                  - `StateDistrictLower`

                </details>
                <details>
                <summary> <code>GrpGeocode</code> - Geocode Details </summary>

                  - `Latitude`

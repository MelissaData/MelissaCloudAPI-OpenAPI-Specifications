        UnifiedSchoolDistrictCode:
          type: string
          description: Returns a 5 digit string representing the Unified School District Code for the requested record.
        UnifiedSchoolDistrictName:
          type: string
          description: Returns the Secondary Unified District Name for the requested record.
        Latitude:
          type: string
          description: Returns the geocoded latitude for the address entered in the AddressLine field.
        Longitude:
          type: string
          description: Returns the geocoded longitude for the address entered in the AddressLine field.

        IPCountryName:
          type: string
          description: The full name of the country where the IP address is located.
        IPDomainName:
          type: string
          description: The domain name associated with this IP address.
        IPISPName:
          type: string
          description: The name of the Internet Service Provider associated with the IP Address.
        IPLatitude:
          type: string
          description: The latitude for the IP address. This usually points to the IP Address's postal code.
        IPLongitude:
          type: string
          description: The longitude for the IP address. This usually points to the IP Address's postal code.
        IPPostalCode:
          type: string
          description: The postal code where the IP Address is located.
        IPProxyDescription:
          type: string
          enum: [Tor-exit, Tor-relay, AOL, Cloud, DNS, VPN, Web-Browser]
          description: Additional Details for the Proxy Type returned.
        IPProxyType:
          type: string
          enum: [Blank, Anonymous, Transparent, Hosting, Corporate, Public, Edu, AOL]
          description: The type of proxy for an IP Address.
        IPRegion:
          type: string
          description: The region where the IP address is located, specific meaning varies from country to country. For IPs in the US this field returns the state that the IP is located within.
        IPUTC:
          type: string
          description: The GMT offset for the area where the IP address is located.
        Gender:
          type: string
          description: Returns a gender for the name in the FullName field.
        Gender2:
          type: string
          description: Only used if 2 names are in the FullName field. Returns a gender for the second name in the FullName field.
        NameFirst:
          type: string
          description: Returns the first name in the FullName field.
        NameFirst2:
          type: string
          description: Only used if 2 names are in the FullName field. Returns the second name in the FullName field.
        NameLast:
          type: string
          description: Returns the last name in the FullName field.
        NameLast2:
          type: string
          description: Only used if 2 names are in the FullName field. Returns a last name for the second name in the FullName field.
        NameMiddle:
          type: string
          description: Returns a middle name for the name in the FullName field.
        NameMiddle2:
          type: string
          description: Only used if 2 names are in the FullName field. Returns a middle name for the second name in the FullName field.
        NamePrefix:
          type: string
          description: Returns a prefix for the name in the FullName field.
        NamePrefix2:
          type: string
          description: Only used if 2 names are in the FullName field. Returns a prefix for the second name in the FullName field.
        NameSuffix:
          type: string
          description: Returns a suffix for the name in the FullName field.
        NameSuffix2:
          type: string
          description: Only used if 2 names are in the FullName field. Returns a suffix for the second name in the FullName field.
        Salutation:
          type: string
          description: Returns a salutation for the name in the FullName field.
        AddressDeliveryInstallation:
          type: string
          description: Canada Only. Returns the parsed delivery installation for the address entered in the AddressLine field.
        AddressHouseNumber:
          type: string
          description: Returns the parsed house number for the address entered in the AddressLine field.
        AddressLockBox:
          type: string
          description: Canada Only. Returns the parsed lock box number for the address entered in the AddressLine field.
        AddressPostDirection:
          type: string
          description: Returns the parsed post-direction for the address entered in the AddressLine field.
        AddressPreDirection:
          type: string
          description: Returns the parsed pre-direction for the address entered in the AddressLine field.
        AddressPrivateMailboxName:
          type: string
          description: Returns the parsed private mailbox name for the address entered in the AddressLine field.
        AddressPrivateMailboxRange:
          type: string
          description: Returns the parsed private mailbox range for the address entered in the AddressLine field.
        AddressRouteService:
          type: string
          description: Canada Only. Returns the parsed route service number for the address entered in the AddressLine field.
        AddressStreetName:
          type: string
          description: Returns the parsed street name for the address entered in the AddressLine field.
        AddressStreetSuffix:
          type: string
          description: Returns the parsed street suffix for the address entered in the AddressLine field.
        AddressSuiteName:
          type: string
          description: Returns the parsed suite name for the address entered in the AddressLine field.
        AddressSuiteNumber:
          type: string
          description: Returns the parsed suite number for the address entered in the AddressLine field.
        DomainName:
          type: string
          description: Returns the parsed domain name for the email entered in the Email field.
        MailboxName:
          type: string
          description: Returns the parsed mailbox name for the email entered in the Email field.
        TopLevelDomain:
          type: string
          description: Returns the parsed top-level domain name for the email entered in the Email field.
        AreaCode:
          type: string
          description: Returns the parsed area code for the phone number entered in the Phone field.
        NewAreaCode:
          type: string
          description: Returns the parsed new area code for the phone number entered in the Phone field.
        PhoneExtension:
          type: string
          description: Returns the parsed extension for the phone number entered in the Phone field.
        PhonePrefix:
          type: string
          description: Returns the parsed prefix for the phone number entered in the Phone field.
        PhoneSuffix:
          type: string
          description: Returns the parsed suffix for the phone number entered in the Phone field.

openapi: 3.1.2
info:
  title: Usage Cloud API
  version: ''
  x-seo:
    description: 'Usage Cloud API by Melissa. Query status and usage of licenses across active Melissa packages.'
  description: |
    ## Usage Cloud API Overview ##
    This is a RESTful API that allows customers to query the status and usage of their licensed services. After authentication customers can retrieve license and usage summaries across all their active packages.

    **Documentation**
    - [Usage Cloud API Documentation](https://docs.melissa.com/cloud-api/usage-cloud-api/usage-cloud-api-index.html#usagecloudapi-index)

    **Useful Resources**
    - [GitHub - Usage Open API Specification](https://github.com/MelissaData/MelissaCloudAPI-OpenAPI-Specification/blob/main/openapi/apis/usage.yaml)
    - [Release notes](https://releasenotes.melissa.com/cloud-api/usage-cloud-api/)
    - [Result codes](https://docs.melissa.com/cloud-api/usage-cloud-api/result-codes.html)

    **Support Center**

    [https://www.melissa.com/company/product-support](https://www.melissa.com/company/product-support)
security: []
tags:
  - name: Usage Query
    description: Use this endpoint to check the status and usage of all your licensed services.
servers:
  - url: https://usage.melissadata.net/v1
    description: Usage Server
paths:
  /license:
    get:
      tags:
        - Usage Query
      summary: Query license usage
      operationId: licenseGet
      description: Use this endpoint to check the status and usage of all your licensed services.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - name: id
          in: query
          description: Required. The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
          required: true
          schema:
            type: string
            format: password
          example: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
        - name: t
          in: query
          description: Serves as a unique request identifier.
          schema:
            type: string
          example: Test
      responses:

components:
  parameters:
    HeaderAcceptParam:
      in: header
      name: Accept
      description: Format of the response.
      required: true
      schema:
        type: string
        enum:
          - 'application/json'
          - '*/*'
      example: '*/*'
    HeaderContentTypeParam:
      in: header
      name: Content-Type
      description: Format of the request.
      required: true
      schema:
        type: string
        enum: [application/json]
      example: 'application/json'
  schemas:
    UsageResponse:
      type: object
      properties:
        Version:
          type: string
          description: The current service version number.
        TransmissionResults:
          type: string
          description: Lists error codes from any errors caused by the most recent request as a whole. For more information, see [Global Email Result Codes](https://docs.melissa.com/cloud-api/global-email/result-codes.html).
        TransmissionReference:
          type: string
          description: A pass-through of the input TransmissionReference field.
        ResponseTimestamp:
          type: string
          description: |
            The timestamp marking when the response was sent. In the format: YYYY-MM-DDTHH:MM:SS.SSSSSSSZ.
        LastUpdate:
          type: string
          description: |
            The timestamp marking when the last update was made. In the format: 'YYYY-MM-DDTHH:MM:SS.SSSSSSS+ZZ:ZZ'.
        ServiceCount:
          type: integer
          description: Total number of records.
        Services:
          type: array
          items:
            type: object
            properties:
              ServiceName:
                type: string
                description: The name of the service.
              Packages:
                type: array
                description: An array containing the packages for the service.
                items:
                  type: object
                  properties:
                    PackageName:
                      type: string
                      description: The name for the package of the related service.
                    ValidFrom:
                      type: string
                      description: |
                        The timestamp marking the start of the validity period. In the format: YYYY-MM-DDTHH:MM:SS.
                    ValidTo:
                      type: string
                      description: |
                        The timestamp marking the end of the validity period. In the format: YYYY-MM-DDTHH:MM:SS.
                    TransactionsUsed:
                      type: integer
                      description: The number of transactions used for the package.
                    TransactionsRemaining:
                      type: integer
                      description: The number of remaining transactions for the package.
                    TransactionsLimit:
                      type: integer
                      description: The total number of transactions possible for the package.
  responses:
    error:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: The type of error that occurred.
              title:
                type: string
                description: A short summary of the error.
              status:
                type: integer
                description: The HTTP status code for the error.
              errors:
                type: object
                properties:
                  $.<PropertyName>:
                    type: array
                    description: A detailed message about the error.
                    items:
                      type: string
              traceId:
                type: string
                description: A unique identifier for the request, useful for debugging.
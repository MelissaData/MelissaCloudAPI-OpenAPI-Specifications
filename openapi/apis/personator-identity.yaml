openapi: 3.1.2
info:
  version: ''
  title: Personator Identity
  x-seo:
    description: 'Personator Identity API by Melissa. Verify identity details with name, address, date of birth, and phone matching.'
  description: |
    ## Personator Identity Overview ##
    The Personator Identity is a single Cloud API that checks and verifies your client/contact data globally. An individual's data can easily be verified against trusted reference data.

    These data verification points include:
    - Name
    - Address
    - Phone
    - Email
    - Date of Birth
    - National ID

    **Documentation**
    - [Personator Identity Documentation](https://docs.melissa.com/cloud-api/personator-identity/personator-identity-index.html)

    **Useful Resources**
    - [GitHub - Personator Identity Open API Specification](https://github.com/MelissaData/MelissaCloudAPI-OpenAPI-Specification/blob/main/openapi/apis/personator-identity.yaml)
    - [Release notes](https://releasenotes.melissa.com/cloud-api/personator-identity/)
    - [Result codes](https://docs.melissa.com/cloud-api/personator-identity/result-codes.html)

    **Product Page**

    [https://www.melissa.com/personator-identity](https://www.melissa.com/personator-identity)

    **Support Center**

    [https://www.melissa.com/company/product-support](https://www.melissa.com/company/product-support)

tags:
  - name: Identity Verification
    description: Use Identity Verification endpoint to request identity verification.

                  <TransmissionResults />
                  <TotalRecords>1</TotalRecords>
                  <Records>
                    <ResponseRecord>
                      <RecordID>1</RecordID>
                      <DeliverabilityConfidenceScore>55</DeliverabilityConfidenceScore>
                      <Results>ES01,ES07,ES08,ES21</Results>
                      <EmailAddress>info@melissa.com</EmailAddress>
                      <MailboxName>info</MailboxName>
                      <DomainName>melissa</DomainName>
                      <DomainAuthenticationStatus />
                      <TopLevelDomain>com</TopLevelDomain>
                      <TopLevelDomainName>Commercial</TopLevelDomainName>
                      <DateChecked>12/12/2025 6:54:36 PM</DateChecked>
                      <EmailAgeEstimated>2941</EmailAgeEstimated>
                      <DomainAgeEstimated>11004</DomainAgeEstimated>
                      <DomainExpirationDate>2026-09-14T23:00:00</DomainExpirationDate>

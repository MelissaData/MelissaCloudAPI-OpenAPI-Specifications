openapi: 3.0.3
info:
  title: Global Email
  version: ''
  description: |
    ## Overview
    The Global Email Cloud API validates and parses email addresses, corrects common typographical errors, and standardizes email addresses. It also features real-time email mailbox verification which removes up to 99% of bad emails.

    Global Email can be used to:

    - Correct syntax errors (remove illegal characters, extra “@” characters etc.)
    - Verify and correct top-level domains
    - Correct common misspellings in domain names
    - Update domains that have changed
    - Standardize casing
    - Validate emails against our database (single or batch requests)
    - Perform real-time mailbox validation

    **Documentation**
    - [Global Email Documentation](https://docs.melissa.com/cloud-api/global-email/global-email-index.html)

    **Useful Resources**
    - [GitHub](https://github.com/MelissaData/MelissaCloudAPI-OpenAPI-Specifications)
    - [Release Notes](https://releasenotes.melissa.com/cloud-api/global-email/)
    - [Result Codes](https://docs.melissa.com/cloud-api/global-email/result-codes.html)

    **Product Page**

    [https://www.melissa.com/email-verification](https://www.melissa.com/email-verification)

    **Support Center**

    [https://www.melissa.com/company/product-support](https://www.melissa.com/company/product-support)
security: []
tags:
  - name: Email Validation
    description: Use this endpoint to verify emails.
  # - name: Version
  #   description: Use this endpoint to check the current version of Global Email.
servers:
  - url: https://globalemail.melissadata.net/v4/WEB/GlobalEmail
    description: Global Email Server
paths:
  /doGlobalEmail:
    get:
      tags:
        - Email Validation
      summary: Validate an email address
      operationId: doGlobalEmailGet
      description: Uses HTTP GET to accept one input record and returns the response in JSON or XML format.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - name: format
          in: query
          description: Specify the desired format of the response (XML or JSON).
          schema:
            type: string
            enum: [JSON, XML]
            default: XML
          example: JSON
        - name: id
          in: query
          description: Required. The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
          required: true
          schema:
            type: string
            format: password
          example: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
        - name: opt
          in: query
          description: |
            [Options](https://docs.melissa.com/cloud-api/global-email/global-email-reference-guide.html#options) - List options in the format `OptionName:Parameter`, with multiple options delimited with a `,`.

            For example: `OptionName:Parameter,OptionName:Parameter`
            - `AllowQuotes:< on | off >` - Allow double-quoted mailbox names. This allows special characters and whitespace within a valid quoted string. Default is `on`.
            - `BounceCheck:< on | off >` - Conditionally triggers a real-time test message to the mail server for a given mailbox. Default is `off`.
            - `DomainCorrection:< on | off >` - Activates fuzzy email domain correction if the domain is a suspected typo. Default is `on`.
            - `TimeToWait:< [5 - 45] >`- Select how long the web service will wait before it times out on an email. Default set to `25`.
            - `VerifyMailbox:< Express | Premium >`
              - `Express` - Quickly validates against database of known email addresses.
              - `Premium` - A real time check is performed to determine email deliverability. This is the default option.
            - `WhoIsLookup:< on | off >` - Activates domain information Lookups. Default is `on`.
          example: TimeToWait:10,WhoIsLookup:off
          schema:
            type: string
        - name: t
          in: query
          description: Serves as a unique request identifier.
          schema:
            type: string
          example: DemoTest
        - name: email
          in: query
          description: Required. The email address to be verified.
          required: true
          schema:
            type: string
          example: info@Melissa.com
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalEmailResponse'
              examples:
                default:
                  summary: Example JSON Response
                  value:
                    Version: "9.4.1.4370"
                    TransmissionReference: "DemoTest"
                    TransmissionResults: ""
                    TotalRecords: "1"
                    Records:
                    - RecordID: "1"
                      DeliverabilityConfidenceScore: "55"
                      Results: "ES01,ES07,ES08,ES21"
                      EmailAddress: "info@melissa.com"
                      MailboxName: "info"
                      DomainName: "melissa"
                      DomainAuthenticationStatus: ""
                      TopLevelDomain: "com"
                      TopLevelDomainName: "Commercial"
                      DateChecked: "12/12/2025 6:54:36 PM"
                      EmailAgeEstimated: "2941"
                      DomainAgeEstimated: "11004"
                      DomainExpirationDate: "2026-09-14T23:00:00"
                      DomainCreatedDate: "1995-09-15T23:00:00"
                      DomainUpdatedDate: "2025-09-15T09:33:41"
                      DomainEmail: ""
                      DomainOrganization: "Domains By Proxy, LLC"
                      DomainAddress1: "DomainsByProxy.com 100 S. Mill Ave, Suite 1600"
                      DomainLocality: "Tempe"
                      DomainAdministrativeArea: "Arizona"

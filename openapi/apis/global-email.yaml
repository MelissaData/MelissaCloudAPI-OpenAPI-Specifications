                    </ResponseRecord>
                  </Records>
                </Response>
              schema:
                $ref: '#/components/schemas/GlobalEmailResponse'

        '400':
          $ref: '#/components/responses/error'
    post:
      tags:
        - Email Validation
      summary: Validate email addresses
      operationId: doGlobalEmailPost

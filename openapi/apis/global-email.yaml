components:
  parameters:
    HeaderAcceptParam:
      in: header
      name: Accept
      description: Format of the response.
      required: true
      schema:
        type: string
        enum:
          - 'application/json'
          - '*/*'
      example: application/json
    HeaderContentTypeParam:
      in: header
      name: Content-Type
      description: Format of the request.
      required: true
      schema:
        type: string
        enum: [application/json, application/xml]
  schemas:
    GlobalEmailRequest:
      xml:
        name: Request
      type: object
      required:
        - CustomerID
        - Records
      properties:
        CustomerID:
          type: string
          description: Required. The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
        Format:
          type: string
          description: Specify the desired format of the response (XML or JSON).
          default: XML
          enum: [JSON, XML]
        Options:
          type: string
          description: |
            [Options](https://docs.melissa.com/cloud-api/global-email/global-email-reference-guide.html#options) - List options in the following format, with multiple options delimited with a `,`.

            `OptionName:Parameter,OptionName:Parameter`
            - `AllowQuotes:< on | off >` - Allow double-quoted mailbox names. This allows special characters and whitespace within a valid quoted string. Default is `on`.
            - `BounceCheck:< on | off >` - Conditionally triggers a real-time test message to the mail server for a given mailbox. Default is `off`.
            - `DomainCorrection:< on | off >` - Activates fuzzy email domain correction if the domain is a suspected typo. Default is `on`.
            - `TimeToWait:< [5 - 45] >`- Select how long the web service will wait before it times out on an email. Default set to `25`.
            - `VerifyMailbox:< Express | Premium >`
              - `Express` - Quickly validates against database of known email addresses.
              - `Premium` - A real time check is performed to determine email deliverability. This is the default option.
            - `WhoIsLookup:< on | off >` - Activates domain information Lookups. Default is `on`.
        Records:
          type: array
          xml:
            wrapped: true
          items:
            type: object
            xml:
              name: RequestRecord
            properties:
              Email:
                type: string
                description: Required. The email address to be verified.
              RecordID:
                type: string
                description: A unique identifier for the record.
          minItems: 1
          maxItems: 100
        TransmissionReference:
          type: string
          description: Serves as a unique request identifier.
    GlobalEmailResponse:
      type: object
      xml:
        name: Response
      properties:
        Version:
          type: string
          description: The current service version number.
        TransmissionReference:
          type: string
          description: A pass-through of the input TransmissionReference field.
        TransmissionResults:
          type: string
          description: Lists error codes from any errors caused by the most recent request as a whole. For more information, see [Global Email Result Codes](https://docs.melissa.com/cloud-api/global-email/result-codes.html).
        TotalRecords:
          type: string
          description: Total number of records.
        Records:
          type: array
          xml:
            wrapped: true
          items:
            type: object
            xml:
              name: ResponseRecord
            properties:
              RecordID:
                type: string
                description: The number of the record. Always 1 for a single email request, otherwise it serves as an index of the array of records.
              DeliverabilityConfidenceScore:
                type: string
                description: The probability [`0-100`]% of an email sent to this mailbox will be successfully delivered.
              Results:
                type: string
                description: Comma delimited status, error codes, and change codes for the record.
              EmailAddress:
                type: string
                description: The email address or domain, including any corrections or updates made by Global Email.
              MailboxName:
                type: string
                description: The mailbox or user name portion of the email address (Everything before the `@` in the email address).
              DomainName:
                type: string
                description: The domain name portion of the email address. (All characters between the `@` and `.` characters.).
              DomainAuthenticationStatus:
                type: string
                description: The security protocols used on the receiving mail server.
              TopLevelDomain:
                type: string
                description: The description associated with the top-level domain name of the email address (e.g. com is Commercial).
              TopLevelDomainName:
                type: string
                description: The top level domain name portion of the email address (All characters after the `.`, e.g. com).
              DateChecked:
                type: string
                description: The date the email was validated. It returns UTC, Unix Time (Epoch Time) in the `MM/DD/YYYY H:MM:SS` format.
              EmailAgeEstimated:
                type: string
                description: The estimated minimum age of the email in days based on historical data. The value is zero when we lack historical data on a given email.
              DomainAgeEstimated:
                type: string
                description: The estimated age of the domain in days.
              DomainExpirationDate:
                type: string
                description: The date the domain expires/expired in the `YYYY-MM-DDTHH:MM:SS` format. This is When the domain will be renewed or available to buy.
              DomainCreatedDate:
                type: string
                description: The date the domain was created in the `YYYY-MM-DDTHH:MM:SS` format.
              DomainUpdatedDate:
                type: string
                description: The date the domain was last updated in the `YYYY-MM-DDTHH:MM:SS` format.
              DomainEmail:
                type: string
                description: The email associated with the domain owner.
              DomainOrganization:
                type: string
                description: The company associated with the domain owner.
              DomainAddress1:
                type: string
                description: The address of the DomainOrganization.
              DomainLocality:
                type: string
                description: The city of the DomainOrganization.
              DomainAdministrativeArea:
                type: string
                description: The state of the DomainOrganization.
              DomainPostalCode:
                type: string
                description: The postal code of the DomainOrganization.
              DomainCountry:
                type: string
                description: The country of the DomainOrganization.
              DomainCountryCode:
                type: string
                description: The country code of the DomainCountry.
              DomainAvailability:
                type: string
                description: Check to see if domain is available for purchase.
              DomainPrivateProxy:
                type: string
                description: Check if domain is behind a private proxy.
              PrivacyFlag:
                type: string
                description: Is this email affected by additional privacy regulations, such as GDPR. Returns `Y` for yes and `N` for no.
              MXServer:
                type: string
                description: Premium only. The Mail Exchange (MX) Server used to validate the email.
              DomainTypeIndicator:
                type: string
                description: Predicts if email belongs to a personal or business/organization email by analyzing the domain.
              BreachCount:
                type: string
                description: The known number of breaches that this email account has been involved in.
    VersionResponse:
      type: object
      properties:
        ServiceName: { type: string }
        Version: { type: string }
        mdMicroServices_Version: { type: string }
        CustomerIDCheckVersion: { type: string }
        EventReportVersion: { type: string }
        RequestLogVersion: { type: string }
        ResourceStoreVersion: { type: string }
        emailLibService_Version: { type: string }
        BuildNumber: { type: string }
        DatabaseDate: { type: string }
        ExpirationDate: { type: string }
  responses:
    error:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: The type of error that occurred.
              title:
                type: string
                description: A short summary of the error.
              status:
                type: integer
                description: The HTTP status code for the error.
              errors:
                type: object
                properties:
                  $.<PropertyName>:
                    type: array
                    description: A detailed message about the error.
                    items:
                      type: string
              traceId:
                type: string
                description: A unique identifier for the request, useful for debugging.
                      PrivacyFlag: "N"
                      MXServer: ""
                      DomainTypeIndicator: "Business/Organization"
                      BreachCount: ""
            application/xml:
              example: |
                <Response xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns="urn:mdGlobalEmail">
                  <Version>9.4.1.4370</Version>

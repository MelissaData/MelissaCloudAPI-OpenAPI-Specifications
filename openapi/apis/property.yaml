        - $ref: '#/components/parameters/LicenseKeyParam'
        - $ref: '#/components/parameters/FormatParam'
        - name: opt
          in: query
          description: |
            [Options](https://docs.melissa.com/cloud-api/property/property-reference-guide.html#property-referenceguide-lookupproperty-options) - Specify which options to use. List options in `<OptionName>:<Parameter>` format. Multiple options are delimited with a `,`.

            For example: `OptionName:Parameter,OptionName:Parameter`.
            - `Desc:< off | on >` - Default set to `off`. This options allows Property to return back human readable descriptions and meanings instead of codes.
            - `LatestMortgage:< Off | On >` - Default set to `Off`. This options allows Property to have the CurrentDeed structure represent the latest mortgage, if available.
          schema:
            type: string
        - $ref: '#/components/parameters/TransmissionReferenceParam'
        - name: a1
          in: query
          description: |
            Input field for address line 1. This should contain the delivery address information (house number, street, building, suite, etc.) but should not contain locality information (city, state, postal code, etc.) which have their own inputs.
          schema:
            type: string
          required: true
          example: 710 Winston Ln
        - name: a2
          in: query
          description: |
            Input field for address line 2. This can be a continuation of AddressLine1 (ex: suite) or another address.
          schema:
            type: string
        - name: addresskey
          in: query
          description: An 11-digit key of the property. Based on the Zip5, Plus4 and two digit delivery code.
          schema:
            type: string
            minLength: 11
            maxLength: 11
        - name: apn
          in: query
          description: Assessor's Parcel Number (APN) for the property.
          schema:
            type: string
        - name: city
          in: query
          description: The city for the property.
          schema:
            type: string
          example: Sugar Land
          required: true
        - name: ctry
          in: query
          description: The country for the property. Currently only properties in the US can be looked up.
          schema:
            type: string
        - name: ff
          in: query
          description: Free form address for the property.
          schema:
            type: string
        - name: fips
          in: query
          description: Federal Information Processing Standard (FIPS) code for the property.
          schema:
            type: string
        - name: mak
          in: query
          description: A proprietary unique key identifier for an address derived from Address Checking.
          schema:
            type: string
        - name: postal
          in: query
          description: The postal code for the property.
          schema:
            type: string
        - name: state
          in: query
          description: The US state for the property.
          schema:
            type: string
          required: true
          example: TX
      responses:
        '200':
          $ref: '#/components/responses/LookupPropertySuccess'
        '400':
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Lookup Property
      summary: Lookup information on properties
      operationId: LookupPropertyPOST
      description: |
        Submit a batch request to receive general information regarding a property.

        The following are the possible minimum input requirements:
        - `AddressKey`
        - `FIPS` and `APN`
        - `FIPS` and `Account`
        - `MAK`
        - `FreeForm`
        - `AddressLine1` with either `PostalCode`, or `City` and `State`
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request_LookupProperty'
            example:
              TransmissionReference: LookupProperty POST Test
              CustomerId: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
              TotalRecords: '1'
              Columns: ''
              Records:
              - RecordID: '1'
                AddressLine1: 710 Winston Ln
                AddressLine2: ''
                City: Sugar Land
                State: TX
                PostalCode: ''
                MAK: ''
                FIPS: ''
                APN: ''
                FreeForm: ''
          application/xml:
            schema:
              $ref: '#/components/schemas/Request_LookupProperty'
            example: |
              <LookupPropertyRequest>
                <TransmissionReference>Test</TransmissionReference>
                <CustomerId>{REPLACE-WITH-YOUR-LICENSE-KEY}</CustomerId>
                <TotalRecords>1</TotalRecords>
                <Columns/>
                <Records>
                  <Record>
                    <RecordID>1</RecordID>
                    <AddressLine1>710 Winston Ln</AddressLine1>
                    <AddressLine2/>
                    <City>Sugar Land</City>
                    <State>TX</State>
                    <PostalCode/>
                    <MAK/>
                    <FIPS/>
                    <APN/>
                    <FreeForm/>
                  </Record>
                </Records>
              </LookupPropertyRequest>
      responses:
        '200':
          $ref: '#/components/responses/LookupPropertySuccess'
        '400':
          $ref: '#/components/responses/Error'

          schema:
            type: string
        - $ref: '#/components/parameters/FormatParam'
        - $ref: '#/components/parameters/LicenseKeyParam'
        - name: opt
          in: query
          description: |
            [Options](https://docs.melissa.com/cloud-api/property/property-reference-guide.html#property-referenceguide-lookupdeeds-options) - Specify which options to use. List options in `<OptionName>:<Parameter>` format. Multiple options are delimited with a `,`.

            For example: `OptionName:Parameter,OptionName:Parameter`.
            - `Page:< Integer >` - Specifies which “page” to return. Acceptable values are any integer.
            - `RecordsPerPage:< 0 - 100 >` - Default set to `1`. Sets the records per “page”. Acceptable values are `0` to `100`, inclusive.
          schema:
            type: string
          example: 'page:1'
        - $ref: '#/components/parameters/TransmissionReferenceParam'
        - name: apn
          in: query
          description: Assessor's Parcel Number (APN) for the property.
          schema:
            type: string
        - name: fips
          in: query
          description: Federal Information Processing Standard (FIPS) code for the property.
          schema:
            type: string
        - name: ff
          in: query
          description: Free form address for the property.
          schema:
            type: string
          required: true
          example: 710 Winston Ln Sugar Land TX
        - name: mak
          in: query
          description: Melissa Address Key - A proprietary unique key identifier for an address derived from Address Checking.
          schema:
            type: string
        - name: txid
          in: query
          deprecated: true
          description: Specific transaction ID to specify one deed or transaction.
          schema:
            type: string

          $ref: '#/components/responses/LookupDeedsSuccess'
        '400':
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Lookup Deeds
      summary: Lookup deeds for properties
      operationId: LookupDeedsPOST
      description: |
        Submit a batch request to receive an array of deeds and/or transactions from the recorder table when given the Property MAK or the FIPs and APN.

        The following are the possible minimum input requirements:
        - `FIPS` and `APN`
        - `PropertyMAK`
        - `FreeForm`
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request_LookupDeeds'
            example:
              TransmissionReference: Test
              CustomerId: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
              Columns: ''
              Options: 'page:1'
              PropertyMAK: ''
              FIPS: ''
              APN: ''
              FreeForm: 710 Winston Ln Sugar Land TX
          application/xml:
            schema:
              $ref: '#/components/schemas/Request_LookupDeeds'
            example: |
              <LookupDeedsRequest>
                <TransmissionReference>Test</TransmissionReference>
                <CustomerId>{REPLACE-WITH-YOUR-LICENSE-KEY}</CustomerId>
                <Columns/>
                <Options>page:1</Options>
                <PropertyMAK/>
                <FIPS/>
                <APN/>
                <FreeForm>710 Winston Ln Sugar Land TX</FreeForm>
              </LookupDeedsRequest>
      responses:
        '200':
          $ref: '#/components/responses/LookupDeedsSuccess'
        '400':
          $ref: '#/components/responses/Error'

  /LookupHomesByOwner:
    get:
      tags:
        - Lookup Homes by Owner
      summary: Lookup homes owned by a homeowner
      description: |
        The LookupHomesByOwner endpoint returns an array of homes owned by a homeowner based on their address (MAK).

        The service requires at least one of the following input combinations:

        **Set A** - `mak`

        **Set B** - `ff`

      operationId: LookupHomesByOwnerGET
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - $ref: '#/components/parameters/FormatParam'
        - $ref: '#/components/parameters/LicenseKeyParam'
        - $ref: '#/components/parameters/TransmissionReferenceParam'
        - name: ff
          in: query
          description: The free form address.
          schema:
            type: string
        - name: mak
          in: query
          description: A proprietary unique key identifier for an address.
          schema:
            type: string
          example: '9005381555'
          required: true
      responses:
        '200':
          $ref: '#/components/responses/LookupHomesByOwnerSuccess'
        '400':
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Lookup Homes by Owner
      summary: Lookup homes owned by homeowners
      operationId: LookupHomesByOwnerPOST
      description: |
        Submit a batch request to receive an array of homes owned by a homeowner based on their address (MAK).

        The following are the possible minimum input requirements:
        - `OwnerMAK`
        - `FreeForm`
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request_LookupHomesByOwner'
            example:
              TransmissionReference: Test
              CustomerId: '{REPLACE-WITH-YOUR-LICENSE-KEY}'
              OwnerMAK: '9005381555'
              FreeForm: ''
          application/xml:
            schema:
              $ref: '#/components/schemas/Request_LookupHomesByOwner'
            example: |
              <LookupHomesByOwnerRequest>
                <TransmissionReference>Test</TransmissionReference>
                <CustomerId>{REPLACE-WITH-YOUR-LICENSE-KEY}</CustomerId>
                <OwnerMAK>9005381555</OwnerMAK>
                <FreeForm/>
              </LookupHomesByOwnerRequest>
      responses:
        '200':
          $ref: '#/components/responses/LookupHomesByOwnerSuccess'
        '400':
          $ref: '#/components/responses/Error'
  /LookupProperty:
    get:
      tags:
        - Lookup Property
      summary: Lookup information on a property
      description: |
        The LookupProperty endpoint returns general information regarding a property.

        The service requires at least one of the following input combinations:

        **Set A** - `addresskey`

        **Set B** - `fips`, `apn`

        **Set C** - `fips`, `account`

        **Set D** - `mak`

        **Set E** - `ff`

        **Set F** - `a1`, `postal`

        **Set G** - `a1`, `city`, `state`

      operationId: LookupPropertyGET
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - name: cols
          in: query
          description: |
            [Columns](https://docs.melissa.com/cloud-api/property/property-reference-guide.html#property-referenceguide-lookupproperty-columns) - The column names or groups to be output.

            Entering the column name will return the column. Specifying a group name will return all columns in the group.

            Delimit multiple columns with a `,`.

            For example: `ColumnName,ColumnName`.


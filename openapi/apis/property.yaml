    LookupProperty_Parcel:
      type: object
      properties:
        AccountNumber:
          type: string
          description: The account number associated with the property. This number is often associated with the owner rather than the property. When this number is associated with the owner, the value often can change and is not ideal for long term property identification.
        AlternateAPN:
          type: string
          description: The alternate Assessor Parcel Number (APN). This is different than the primary APN.
        APNYearChange:
          type: string
          deprecated: true
          description: The year the Assessor Parcel Number (APN) was changed from the PreviousAPN to the current APN.
        CBSACode:
          type: string
          description: Core Based Statistical Area code assigned by the United States Office of Management and Budget in 2013. Covers both Metropolitan Statistical Area as well as the Micropolitan Statisticals Area assignments.
        CBSAName:
          type: string
          description: Core Based Statistical Area name assigned by the United States Office of Management and Budget in 2013. Covers both Metropolitan Statistical Area as well as the Micropolitan Statisticals Area assignments.
        CensusBlock:
          type: string
          description: Census Block as defined by the U.S. Census Bureau.
        CensusBlockGrp:
          type: string
          description: Census Block Group as defined by the U.S. Census Bureau.
        CensusTract:
          type: string
          description: Census Tract as defined by the U.S. Census Bureau.
        County:
          type: string
          description: The county where the property is located.
        FIPSCode:
          type: string
          description: The five-digit numeric Federal Information Processing Standard (FIPS) code.
        FormattedAPN:
          type: string
          description: The formatted Assessor Parcel Number (APN). Special characters are removed.
        MapBook:
          type: string
          description: The book reference for the parcel.
        MapPage:
          type: string
          description: The page reference for the parcel.
        MetropolitanDivision:
          type: string
          description: Metropolitan Division Name assigned by the United States Office of Management and Budget in 2013.
        MinorCivilDivisionCode:
          type: string
          description: A 5 digit numeric code assigned by the U.S. Census Bureau that is used by 29 states and corresponds or matches with towns within the state most of the time.
        MinorCivilDivisionName:
          type: string
          description: The name of the town indicated by the MinorCivilDivisionCode.
        MSACode:
          type: string
          description: Metropolitan Statistical Area code.
        MSAName:
          type: string
          description: Metropolitan Statistical Area name.
        NeighborhoodCode:
          type: string
          deprecated: true
          description: A code provided by the county tax assessor used to identify geographic areas within an assessing unit for property valuation purposes. A unique code is assigned for each geographic area.
        PreviousAPN:
          type: string
          description: The previous Assessor Parcel Number (APN). This number was changed by an Assessor.
        TaxJurisdiction:
          type: string
          description: Name of the tax jurisdiction. This is typically the name of the county with some exceptions. Those exceptions being primarily in the New England area where the townships are the taxing authority instead.
        UnformattedAPN:
          type: string
          description: The unformatted Assessor Parcel Number (APN).
        YearAdded:
          type: string
          deprecated: true
          description: The year the current APN was created.

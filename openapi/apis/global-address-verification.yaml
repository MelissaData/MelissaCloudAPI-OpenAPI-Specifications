              query.Add("a1", "22382 Avenida Empresa")
              query.Add("admarea", "CA")
              query.Add("ctry", "USA")
              query.Add("loc", "Rancho Santa Margarita")
              query.Add("postal", "92688")
              req.URL.RawQuery = query.Encode()

              if err != nil {
                panic(err)
              }
              req.Header.Add("Accept", "application/json")
              req.Header.Add("Content-Type", "application/json")
              res, err := http.DefaultClient.Do(req)

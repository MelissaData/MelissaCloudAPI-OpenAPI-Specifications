openapi: 3.0.3
info:
  version: ''
  title: Global Express Entry
  description: |
    ## Overview
    Global Express Entry is an auto-complete address verification service that will complete your query with a verified address, including city, state, and postal code with 50% fewer keystrokes.

    Global Express Entry can:

    - Complete free form partial address input with standardized and verified addresses.
    - Return geocoding coordinates along with address (in supported countries).
    - Filter output by state, distance from a lat/long point, Residence or Business, or ZIP Code (U.S. only).

    Express Entry supports filtering of results in the U.S. by using an endpoint with specific criteria.
    Visit Melissa Docs for more information on [Filtering](https://docs.melissa.com/cloud-api/global-express-entry/global-express-entry-other.html#filtering).

    **Documentation**
    - [Global Express Entry Documentation](https://docs.melissa.com/cloud-api/global-express-entry/global-express-entry-index.html)

    **Useful Resources**
    - [Release Notes](https://releasenotes.melissa.com/cloud-api/global-express-entry/)
    - [Result Codes](https://docs.melissa.com/cloud-api/global-express-entry/result-codes.html)

    **Product Page**

    [https://www.melissa.com/address-autocomplete](https://www.melissa.com/address-autocomplete)

    **Support Center**

    [https://www.melissa.com/company/product-support](https://www.melissa.com/company/product-support)
security: []
servers:
  - url: https://expressentry.melissadata.net/web
    description: Global Express Entry Server
  - url: https://expressentry.melissadata.net/jsonp
    description: Global Express Entry Server for Javascript response
tags:
  - name: Address Autocompletion
    description: Use these endpoints to complete partial inputs with a verified address.
paths:
  /GlobalExpressAddress:
    get:
      summary: Global Express Address
      description: |
        The GlobalExpressAddress service is consumed to retrieve results containing all of the available address elements of an address record.

        A typical use of the GlobalExpressAddress method is preceded by a call to the GlobalExpressPostalCode service.
        The GlobalExpressPostalCode service is provided as a means of retrieving postal code, locality, and administrative area combinations using the postal code as the search input.
      operationId: globalExpressAddressGET
      tags:
        - Address Autocompletion
      parameters:
        - name: cols
          $ref: '#/components/parameters/colsParam'
        - name: diacriticreplace
          $ref: '#/components/parameters/diacriticreplaceParam'
        - name: format
          $ref: '#/components/parameters/formatParam'
        - name: id
          $ref: '#/components/parameters/idParam'
        - name: maxrecords
          $ref: '#/components/parameters/maxrecordsParam'
        - name: nativecharset
          $ref: '#/components/parameters/nativecharsetParam'
        - name: opt
          $ref: '#/components/parameters/optParam'
        - name: address1
          in: query
          description: The input field for the address, delimited by `%20` or a space. This should contain the street address information (house number, thoroughfare, building, suite, etc.)
          schema:
            type: string
        - name: address2
          in: query
          description: An additional field for extra address lines.
          schema:
            type: string
        - name: address3
          in: query
          description: An additional field for extra address lines.
          schema:
            type: string
        - name: administrativearea
          $ref: '#/components/parameters/administrativeareaParam'
        - name: country
          $ref: '#/components/parameters/countryParam'
        - name: locality
          $ref: '#/components/parameters/localityParam'
        - name: postalcode
          $ref: '#/components/parameters/postalcodeParam'
      responses:
        '200':
          description: Global Express Address response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalExpressAddress_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/default'
                USOnly:
                  summary: US Only with cols Specified
                  $ref: '#/components/examples/USOnly'
                GBOnly:
                  summary: GB Only with cols Specified
                  $ref: '#/components/examples/GBOnly'
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalExpressAddress_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/xmlResponse'
            application/javascript:
              schema:
                $ref: '#/components/schemas/javascriptResponse'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/javascriptResponse'
        '400':
          description: Bad Request
          $ref: '#/components/responses/error'
  /GlobalExpressCountry:
    get:
      summary: Global Express Country
      description: |
        The GlobalExpressCountry endpoint returns the country names containing the search term in the Country= parameter. Country names in five languages are returned:

        - English
        - Spanish
        - French
        - German
        - Simplified Chinese.
      operationId: globalExpressCountryGET
      tags:
        - Address Autocompletion
      parameters:
        - name: id
          $ref: '#/components/parameters/idParam'
        - name: country
          $ref: '#/components/parameters/countryParam'
        - name: format
          $ref: '#/components/parameters/formatParam'
      responses:
        '200':
          description: Global Express Country response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalExpressCountry_Response'
              example:
                Version: "8.0.0.1249"
                ResultCode: "XS01"
                ErrorString: ""
                Results:
                  - Country: "Usbekistan"
                    English: "Uzbekistan"
                    Spanish: "Uzbekistán"
                    French: "Ouzbékistan"
                    German: "Usbekistan"
                    SimplifiedChinese: "乌兹别克斯坦"
                    Char2ISO: "UZ"
                    Char3ISO: "UZB"
                    ISONumeric: "860"
                  - Country: "Tierras Australes y Antárticas Francesas"
                    English: "French Southern and Antarctic Lands"
                    Spanish: "Tierras Australes y Antárticas Francesas"
                    French: "Terres australes et antarctiques françaises"
                    German: "Französische Süd- und Antarktisgebiete"
                    SimplifiedChinese: "法属南部领土"
                    Char2ISO: "TF"
                    Char3ISO: "ATF"
                    ISONumeric: "260"
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalExpressCountry_Response'
              example: |
                <Response
                  xmlns:i="http://www.w3.org/2001/XMLSchema-instance">
                  <Version>8.0.0.1249</Version>
                  <ResultCode>XS01</ResultCode>
                  <ErrorString></ErrorString>
                  <Results>
                    <Result>
                      <Country>Usbekistan</Country>
                      <English>Uzbekistan</English>
                      <Spanish>Uzbekistán</Spanish>
                      <French>Ouzbékistan</French>
                      <German>Usbekistan</German>
                      <SimplifiedChinese>乌兹别克斯坦 </SimplifiedChinese>
                      <Char2ISO>UZ</Char2ISO>
                      <Char3ISO>UZB</Char3ISO>
                      <ISONumeric>860</ISONumeric>
                    </Result>
                    ...
                    <Result>
                      <Country>Tierras Australes y Antárticas Francesas</Country>
                      <English>French Southern Territories</English>
                      <Spanish>Tierras Australes y Antárticas Francesas</Spanish>
                      <French>Terres Australes Françaises</French>
                      <German>Französische Süd- und Antarktisgebiete</German>
                      <SimplifiedChinese>法属南部领土</SimplifiedChinese>
                      <Char2ISO>TF</Char2ISO>
                      <Char3ISO>ATF</Char3ISO>
                      <ISONumeric>260</ISONumeric>
                    </Result>
                  </Results>
                </Response>
            application/javascript:
              example: |
                {
                  "d": {
                    "Version": "8.0.0.1249",
                    "ResultCode": "XS01",
                    "ErrorString": "",
                    "Results": [
                      {
                        "Country": "Usbekistan",
                        "English": "Uzbekistan",
                        "Spanish": "Uzbekistán",
                        "French": "Ouzbékistan",
                        "German": "Usbekistan",
                        "SimplifiedChinese": "乌兹别克斯坦",
                        "Char2ISO": "UZ",
                        "Char3ISO": "UZB",
                        "ISONumeric": "860"
                      },
                      ...
                      {
                        "Country": "Tierras Australes y Antárticas Francesas",
                        "English": "French Southern Territories",
                        "Spanish": "Tierras Australes y Antárticas Francesas",
                        "French": "Terres Australes Françaises",
                        "German": "Französische Süd- und Antarktisgebiete",
                        "SimplifiedChinese": "法属南部领土",
                        "Char2ISO": "TF",
                        "Char3ISO": "ATF",
                        "ISONumeric": "260"
                      }
                    ]
                  }
                }
              schema:
                type: object
                properties:
                  d:
                    $ref: '#/components/schemas/GlobalExpressCountry_Response'
        '400':
          description: Bad Request
          $ref: '#/components/responses/error'
  /GlobalExpressFreeForm:
    get:
      summary: Global Express Free Form
      description: |
        The GlobalExpressFreeForm service is provided as a means of retrieving all available address elements using a free form search.
      operationId: globalExpressFreeFormGET
      tags:
        - Address Autocompletion
      parameters:
        - name: cols
          $ref: '#/components/parameters/colsParam'
        - name: diacriticreplace
          $ref: '#/components/parameters/diacriticreplaceParam'
        - name: format
          $ref: '#/components/parameters/formatParam'
        - name: id
          $ref: '#/components/parameters/idParam'
        - name: maxrecords
          $ref: '#/components/parameters/maxrecordsParam'
        - name: nativecharset
          $ref: '#/components/parameters/nativecharsetParam'
        - name: opt
          $ref: '#/components/parameters/optParam'
        - name: country
          $ref: '#/components/parameters/countryParam'
        - name: ff
          in: query
          description: Free Form input.
          schema:
            type: string
          example: "22382+Avenida+Empresa,+Rancho+Santa+Margarita,+CA+92688"
      responses:
        '200':
          description: Global Express Free Form response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalExpressFreeForm_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/default'
                USOnly:
                  summary: US Only with cols Specified
                  $ref: '#/components/examples/USOnly'
                GBOnly:
                  summary: GB Only with cols Specified
                  $ref: '#/components/examples/GBOnly'
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalExpressFreeForm_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/xmlResponse'
            application/javascript:
              schema:
                $ref: '#/components/schemas/javascriptResponse'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/javascriptResponse'
        '400':
          description: Bad Request
          $ref: '#/components/responses/error'
  /GlobalExpressLocalityAdministrativeArea:
    get:
      summary: Global Express Locality & Administrative Area
      description: |
        GlobalExpressLocalityAdministrativeArea is provided as a means of retrieving locality and administrative area combinations using the locality name.
      operationId: globalExpressLocalityAdministrativeAreaGET
      tags:
        - Address Autocompletion
      parameters:
        - name: diacriticreplace
          $ref: '#/components/parameters/diacriticreplaceParam'
        - name: format
          $ref: '#/components/parameters/formatParam'
        - name: id
          $ref: '#/components/parameters/idParam'
        - name: maxrecords
          $ref: '#/components/parameters/maxrecordsParam'
        - name: nativecharset
          $ref: '#/components/parameters/nativecharsetParam'
        - name: administrativearea
          $ref: '#/components/parameters/administrativeareaParam'
        - name: country
          $ref: '#/components/parameters/countryParam'
        - name: locality
          $ref: '#/components/parameters/localityParam'
        - name: postalcode
          $ref: '#/components/parameters/postalcodeParam'
      responses:
        '200':
          description: Global Express Locality Administrative Area response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalExpressLocalityAdministrativeArea_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/default'
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalExpressLocalityAdministrativeArea_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/xmlResponse'
            application/javascript:
              schema:
                $ref: '#/components/schemas/javascriptResponse'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/javascriptResponse'
        '400':
          description: Bad Request
          $ref: '#/components/responses/error'
  /GlobalExpressPostalCode:
    get:
      summary: Global Express Postal Code
      description: |
        GlobalExpressPostalCode is provided as a convenient method for quickly retrieving locality and administrative area information using the postal code as the input. A subsequent call to GlobalExpressAddress benefits greatly by using the locality and administrative area information from GlobalExpressPostalCode with GlobalExpressLocalityAdministrativeArea.
      operationId: globalExpressPostalCodeGET
      tags:
        - Address Autocompletion
      parameters:
        - name: diacriticreplace
          $ref: '#/components/parameters/diacriticreplaceParam'
        - name: format
          $ref: '#/components/parameters/formatParam'
        - name: id
          $ref: '#/components/parameters/idParam'
        - name: maxrecords
          $ref: '#/components/parameters/maxrecordsParam'
        - name: country
          $ref: '#/components/parameters/countryParam'
        - name: postalcode
          $ref: '#/components/parameters/postalcodeParam'
      responses:
        '200':
          description: Global Express Locality Administrative Area response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalExpressPostalCode_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/default'
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalExpressPostalCode_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/xmlResponse'
            application/javascript:
              schema:
                $ref: '#/components/schemas/javascriptResponse'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/javascriptResponse'
        '400':
          description: Bad Request
          $ref: '#/components/responses/error'
  /GlobalExpressThoroughfare:
    get:
      summary: Global Express Thoroughfare
      description: |
        GlobalExpressThoroughfare is a means for retrieving the thoroughfares within a Postal Code using the Postal Code and beginning of the thoroughfare name as the inputs.
      operationId: globalExpressThoroughfareGET
      tags:
        - Address Autocompletion
      parameters:
        - name: diacriticreplace
          $ref: '#/components/parameters/diacriticreplaceParam'
        - name: format
          $ref: '#/components/parameters/formatParam'
        - name: id
          $ref: '#/components/parameters/idParam'
        - name: maxrecords
          $ref: '#/components/parameters/maxrecordsParam'
        - name: country
          $ref: '#/components/parameters/countryParam'
        - name: postalcode
          $ref: '#/components/parameters/postalcodeParam'
        - name: thoroughfare
          in: query
          description: |
            Street, Thoroughfare. This is used to limit the search to thoroughfares beginning with the specified letters.
            This requires a minimum of three characters. For example, mai will return all thoroughfares beginning with mai in the specified postal code.
          schema:
            type: string
      responses:
        '200':
          description: Global Express Locality Administrative Area response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalExpressThoroughfare_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/default'
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalExpressThoroughfare_Response'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/xmlResponse'
            application/javascript:
              schema:
                $ref: '#/components/schemas/javascriptResponse'
              examples:
                default:
                  summary: Default Response
                  $ref: '#/components/examples/javascriptResponse'
        '400':
          description: Bad Request
          $ref: '#/components/responses/error'

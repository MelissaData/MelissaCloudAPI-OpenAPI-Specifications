  parameters:
    idParam:
      name: id
      in: query
      required: true
      description: The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
      schema:
        type: string
        format: password
      example: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
    formatParam:
      name: format
      in: query
      description: |
        Desired format of the response. Possible values are `json`, `jsonp`, or `xml`, depending on the endpoint.

        **Note**: the base URL for JavaScript format request is `https://expressentry.melissadata.net/jsonp/`.
      schema:
        type: string
        enum: [xml, json, jsonp]
      example: json
    countryParam:
      name: country
      in: query
      description: ISO-2 Code or full country name.
      schema:
        type: string
        default: US
      example: US
    maxrecordsParam:
      name: maxrecords
      in: query
      description: Maximum number of records to return.
      schema:
        type: number
        default: 10
        maximum: 100
      example: 20
    nativecharsetParam:
      name: nativecharset
      in: query
      description: |
        `True`, `False`, or blank.
        When set to `True`, return results in the native character set for the country.
        When set to `False`, return transliterated results in the Latin character set.
        When set to blank `&nativecharset=`, return results in the input character set.
      schema:
        type: boolean
        enum: [True, False]
      example: True
    administrativeareaParam:
      name: administrativearea
      in: query
      description: Administrative Area, Province, State. The most common geographic data element.
      schema:
        type: string
      example: CA
    postalcodeParam:
      name: postalcode
      in: query
      description: Postal Code, ZIP - The postal code to be verified.
      schema:
        type: string
      example: "92688"
    localityParam:
      name: locality
      in: query
      description: City, Locality, Municipality - The most common population center data element.
      schema:
        type: string
      example: Rancho Santa Margarita
    diacriticreplaceParam:
      name: diacriticreplace
      in: query
      description: |
        `True` replaces diacritics in the address. `False` will keep current diacritics in the address results. If left blank, this defaults to `False`.
      schema:
        type: boolean
        enum: [True, False]
      example: True
    colsParam:
      name: cols
      in: query
      description: |
        [Columns](https://docs.melissa.com/cloud-api/global-express-entry/global-express-entry-reference-guide.html#globalexpressentry-referenceguide-globalexpressfreeform-columns) - Entering the column name will return the column. Specifying a group name will return all columns in the group.
        Delimit multiple columns with a `,`.
        - `gbextras` - **GB Only**. Return UPRN (SourceID) and UDPRN (SupplierID) values for each address. These will be in the `Extras` element.
        - `results` - **US Only**. Return Address Object result codes for each address in the Extras field. For example, a USPS only address will return `"AddrObjectResultCode": "AS01"`.
      schema:
        type: string
        enum: [gbextras, results]
      example: "gbextras"
    optParam:
      name: opt
      in: query
      description: |
        [Options](https://docs.melissa.com/cloud-api/global-express-entry/global-express-entry-reference-guide.html#globalexpressentry-referenceguide-globalexpressfreeform-options) to modify the output.
        - `poboxes:< true | false >` -  `true` will allow P.O. Boxes and military addresses to be returned with U.S. Addresses.
      schema:
        type: string
      example: "poboxes:true"

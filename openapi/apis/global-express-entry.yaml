          type: string
          description: A list of accepted city names.
        CityNotAccepted:
          type: string
          description: Any non-accepted city names will be included in this field.
        DependentLocality:
          type: string
          description: |
            **Urbanization**. A dependent locality is a logical area unit that is smaller than a locality but larger than a double dependent locality or thoroughfare. It can often be associated with a neighborhood or sector.
        DoubleDependentLocality:
          type: string
          description: A logical area unit that is smaller than a dependent locality but bigger than a thoroughfare. This field is rarely used.
        Thoroughfare:
          type: string
          description: |

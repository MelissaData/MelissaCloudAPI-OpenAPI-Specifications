        DependentThoroughfare:
          type: string
          description: Dependent Street. A second thoroughfare that is required to narrow down the final address. This is rarely used.
        Building:
          type: string
          description: A descriptive name identifying an individual location.
        Premise:
          type: string
          description: |
            **Street Number**. The premise identifying number.
        SubBuilding:
          type: string
          description: A smaller division of a building. For example, if an address has a building name that is a part of a larger set of buildings, then the sub building may be populated.
        PostalCode:
          type: string
          description: |
            **ZIP Code**. Complete postal code for a particular delivery point.
        PostalCodePrimary:
          type: string
          description: The primary portion of the postal code. In the US, this is a 5-digit ZIP code.
        PostalCodeSecondary:
          type: string
          description: The secondary portion of the postal code. In the US this is the +4 of the ZIP code.
        Organization:
          type: string
          description: |
            **Business, Company**. This name of the organization.
        PostBox:
          type: string
          description: Post box information for a particular delivery point.
        Unmatched:
          type: string
          description: Any part of the address that did not match other fields will be saved in this field.
        GeneralDelivery:
          type: string
          description: The USPS address type assigned for the address.
        DeliveryInstallation:
          type: string
          description: |
            **Canada Only**. The delivery installation for the address.
        Route:
          type: string
          description: |
            **Canada Only**. The route service number.
        AdditionalContent:
          type: string
          description: Any additional content associated with the address.
        CountrySubdivisionCode:
          type: string
          description: This is the ISO3166-2 code for country subdivisions, usually the administrative area for a country. The format is the 2 letter country code followed by a dash followed by 2 or 3 characters or two numbers.
        MAK:
          type: string
          description: Melissa Address Key. A unique key assigned to the submitted address.
        BaseMAK:
          type: string
          description: Melissa Address Key Base. If the address has suites or apartments the 10 digit proprietary BaseMAK will be returned and correspond to the overall building.
        Latitude:
          type: string
          description: The latitude geographic coordinate of the output address.
        Longitude:
          type: string
          description: The longitude geographic coordinate of the output address.
        DistanceFromPoint:
          type: integer
          description: The distance in miles from the specified point.
        Extras:
          type: object
          description: This element will be returned, depending on which additional columns are specified.
          properties:
            UDPRN:
              type: string
              description: |
                **GB Only**. The Unique Delivery Point Reference Number issued by Royal Mail. This is an 8-digit unique number.
            UPRN:
              type: string
              description: |
                **GB Only**. The Unique Property Reference Number issued by Royal Mail. This is a number unique to each address in GB. This is a unique number up to 12-digits long.
            AddrObjectResultCode:
              type: string
              description: |
                **US Only**. Address Object result code indicates the level of match for the address.


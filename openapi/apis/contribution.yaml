  #   description: Use Add MIK endpoint to submit a request to add a new Melissa Identity Address Key (MIK).
  # - name: Change Email
  #   description: Use Change Email endpoint to submit existing email status changes.
  - name: Change GeoPoint
    description: Use this endpoint to submit problem GeoPoints with comments and proposed corrections.
  # - name: Change MAK

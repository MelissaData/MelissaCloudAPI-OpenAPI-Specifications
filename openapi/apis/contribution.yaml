components:
  parameters:
    HeaderAcceptParam:
      in: header
      name: Accept
      description: Format of the response.
      required: true
      schema:
        type: string
        enum:
          - 'application/json'
          - '*/*'
      example: application/json
    HeaderContentTypeParam:
      in: header
      name: Content-Type
      description: Format of the request.
      required: true
      schema:
        type: string
        enum: [application/json]
    TransmissionReferenceParam:
      name: t
      in: query
      description: Value passed through unchanged to the response for identification or any other purpose.
      schema:
        type: string
      example: Test
    LicenseKeyParam:
      name: id
      in: query
      description: Required. The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
      required: true
      schema:
        format: password
      example: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
    RespondToParam:
      name: respondto
      in: query
      description: The email address to receive updates about the change request.
      schema:

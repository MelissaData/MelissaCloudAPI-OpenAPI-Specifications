  /changeGeoPoint:
    get:
      tags:
        - Change GeoPoint
      summary: Change a GeoPoint
      description: |
        Use this GET endpoint to submit problem GeoPoints with comments and proposed corrections. This is part of our contribution pipeline to include user input and improve data accuracy.

        To ensure your correction can be processed, include the MelissaAddressKey (MAK) identifier for the address, the proposed new coordinates (latitude and longitude), and an explanation in the comments field (e.g., “Moved pin from the highway to the actual building entrance”). Submissions without adequate justification may be discarded.

        Upon a successful request you will get an `MS01` result code and a successful submission message.

        All user contributions enter a queue and are evaluated by our team on a case-by-case basis.

        Submitting a correction does not guarantee that it will be approved or integrated into the active dataset.
      operationId: changeGeoPointGET
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - $ref: '#/components/parameters/TransmissionReferenceParam'
        - $ref: '#/components/parameters/LicenseKeyParam'
        - name: ctry
          in: query
          required: true
          description: ISO2 code for the country.
          schema:
            type: string
          example: US
        - name: mak
          in: query
          required: true
          description: A proprietary unique key identifier for an address.
          schema:
            type: number
          example: 8008006245
        - name: lat
          in: query
          required: true
          description: The corrected latitude.
          schema:
            type: number
          example: 33.637562
        - name: long
          in: query
          required: true
          description: The corrected longitude.
          schema:
            type: number
          example: -117.606887
        - name: reason
          in: query
          description: Any additional information you want to add about the change request.
          schema:
            type: string
          example: GeoPoint Change needed
        - $ref: '#/components/parameters/RespondToParam'
      responses:
        '200':
          $ref: '#/components/responses/success'
        '400':
          $ref: '#/components/responses/error'
    post:
      tags:
        - Change GeoPoint
      operationId: changeGeoPointPOST
      summary: Change GeoPoints
      description: |
        Use this POST endpoint to submit problem GeoPoints with comments and proposed corrections. This is part of our contribution pipeline to include user input and improve data accuracy.

        To ensure your correction can be processed, include the MelissaAddressKey (MAK) identifier for the address, the proposed new coordinates (latitude and longitude), and an explanation in the comments field (e.g., “Moved pin from the highway to the actual building entrance”). Submissions without adequate justification may be discarded.

        Upon a successful request you will get an `MS01` result code and a successful submission message.

        All user contributions enter a queue and are evaluated by our team on a case-by-case basis.

        Submitting a correction does not guarantee that it will be approved or integrated into the active dataset.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestChangeGeoPoint'
            example:
              CustomerID: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
              TransmissionReference: "Test"
              Country: "US"
              Latitude: "33.637562"
              Longitude: "-117.606887"
              MelissaAddressKey: "8008006245"
              Reason: "GeoPoint Change needed"
              RespondToEmail: "youremail@melissadata.com"
      responses:
        '200':
          $ref: '#/components/responses/success'
        '400':
          $ref: '#/components/responses/error'

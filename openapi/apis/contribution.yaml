servers:
  - url: http://contribution.melissadata.net/V4/WEB
    description: Contribution Server
paths:
  /addMAK:
    get:
      tags:
        - Add MAK
      summary: Add a new MAK
      description: |
        Use this GET endpoint to submit a request to add an unlisted address for review and the generation of an associated Melissa Address Key (MAK). This is part of our contribution pipeline to include user input and improve data accuracy.

        To ensure your request can be processed, include the complete address details (e.g. address line 1, locality (city), administrative area (state), postal code (zip), country, and an explanation in the comments field (e.g., “New residential subdivision” or “Commercial building recently completed”). Submissions without adequate justification may be discarded.

        Upon a successful request you will get an `MS01` result code and a successful submission message.

        All user contributions enter a queue and are evaluated by our team on a case-by-case basis.

        Submitting a correction does not guarantee that it will be approved or integrated into the active dataset.
      operationId: addMakGET
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - $ref: '#/components/parameters/TransmissionReferenceParam'
        - $ref: '#/components/parameters/LicenseKeyParam'
        - name: a1
          in: query
          required: true
          description: A minimum address location for the contact.
          schema:
            type: string
          example: 22382 Avenida Empresa
        - name: a2
          in: query
          description: The second address line.
          schema:
            type: string
        - name: a3
          in: query
          description: The third address line.
          schema:
            type: string
        - name: a4
          in: query
          description: The fourth address line.
          schema:
            type: string
        - name: a5
          in: query
          description: The fifth address line.
          schema:
            type: string
        - name: a6
          in: query
          description: The sixth address line.
          schema:
            type: string
        - name: a7
          in: query
          description: The seventh address line.
          schema:
            type: string
        - name: a8
          in: query
          description: The eighth address line.
          schema:
            type: string
        - name: admarea
          in: query
          description: Administrative Area, Province, State. The most common geographic data element.
          example: CA
          required: true
          schema:
            type: string
        - name: ctry
          in: query
          required: true
          description: ISO2 code for the country.
          schema:
            type: string
          example: US
        - name: lat
          in: query
          required: true
          description: The latitude.
          schema:
            type: number
          example: 33.637562
        - name: loc
          in: query
          description: City, Locality, Municipality. The most common population center data element.
          schema:
            type: string
          required: true
          example: Rancho Santa Margarita
        - name: long
          in: query
          required: true
          description: The longitude.
          schema:
            type: number
          example: -117.606887
        - name: org
          in: query
          description: The organization name associated with the address record.
          schema:
            type: string
        - name: postal
          in: query
          required: true
          description: The ZIP Code.
          schema:
            type: string
          example: '92688'
        - name: reason
          in: query
          description: Any additional information you want to add about the change request.
          schema:
            type: string
          example: Add a MAK
        - $ref: '#/components/parameters/RespondToParam'

      responses:
        '200':
          $ref: '#/components/responses/success'
        '400':
          $ref: '#/components/responses/error'
    post:
      tags:
        - Add MAK
      operationId: addMakPOST
      summary: Add new MAKs
      description: |
        Use this POST endpoint to submit a request to add an unlisted address for review and the generation of an associated Melissa Address Key (MAK). This is part of our contribution pipeline to include user input and improve data accuracy.

        To ensure your request can be processed, include the complete address details (e.g. address line 1, locality (city), administrative area (state), postal code (zip), country, and an explanation in the comments field (e.g., “New residential subdivision” or “Commercial building recently completed”). Submissions without adequate justification may be discarded.

        Upon a successful request you will get an `MS01` result code and a successful submission message.

        All user contributions enter a queue and are evaluated by our team on a case-by-case basis.

        Submitting a correction does not guarantee that it will be approved or integrated into the active dataset.
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAddMAK'
            example:
              CustomerID: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
              TransmissionReference: "Test"
              AddressLine1: "22382 Avenida Empresa"
              AddressLine2: ""
              Locality: "Rancho Santa Margarita"
              Country: "US"
              Latitude: "33.637562"
              Longitude: "-117.606887"
              PostalCode: "92688"
              Reason: "Add a MAK"
              RespondToEmail: "youremail@melissadata.com"
              AdministrativeArea: "CA"
      responses:
        '200':
          $ref: '#/components/responses/success'
        '400':
          $ref: '#/components/responses/error'


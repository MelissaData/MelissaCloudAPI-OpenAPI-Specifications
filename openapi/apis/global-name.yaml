openapi: 3.0.3
info:
  version: ''
  title: Global Name
  x-seo:
    description: 'Global Name API by Melissa. Parse, validate, and standardize personal and business names globally.'
  description: |
    ## Global NameOverview ##
    The Global Name Cloud API takes full names and optionally a Country as input and uses intelligent recognition to identify over 6,000,000 last names and 4,000,000 first names across different countries and languages. Global Name is used to validate and parse the names of people and businesses. Use this API at the point of entry to detect vulgarities and suspicious names and prevent them from entering the Database.

    Global Name can be used to:

    * Parse full names into first, middle and last names, as well as prefixes like “Dr.” and suffixes like “Jr.”
    * Correct misspelled first names
    * Flag vulgar and obviously fake names, such as “Bugs Bunny.”
    * Split dual names (ex. Mr and Mrs John and Mary Jones)
    * Assign gender based on known first names and prefixes.
    * Output preferred output Salutation name parts.
    * Standardize company names

    **Documentation**
    * [Global Name Documentation](https://docs.melissa.com/cloud-api/global-name/global-name-index.html)

    **Useful Resources**
    * [GitHub - Global Name Open API Specification](https://github.com/MelissaData/MelissaCloudAPI-OpenAPI-Specification/blob/main/openapi/apis/global-name.yaml)
    * [Release notes](https://releasenotes.melissa.com/cloud-api/global-name/)
    * [Result codes](https://docs.melissa.com/cloud-api/global-name/result-codes.html)

    **Product Page**

    [https://www.melissa.com/name-verification](https://www.melissa.com/name-verification)

    **Support Center**

    [https://www.melissa.com/company/product-support](https://www.melissa.com/company/product-support)

security: []
tags:
  - name: Name Verification
    description: Use Name Verification endpoint to validate, standardize, and verify personal and business names.
servers:
  - url: https://globalname.melissadata.net/V3/WEB/GlobalName
    description: Global Name Server
paths:
  /doGlobalName:
    get:
      tags:
        - Name Verification
      summary: Verify a name or company
      description: |
        This is the Global Name request.

        **_Note:_** A License Key is required with either Company or FullName for this request.
      operationId: doGlobalNameGET
      parameters:
        - $ref: '#/components/parameters/HeaderAcceptParam'
        - $ref: '#/components/parameters/HeaderContentTypeParam'
        - name: t
          in: query
          description: This is a string value that serves as a unique identifier for this set of records. It is returned as sent.
          schema:
            type: string
          example: "Test"
        - name: id
          in: query
          required: true
          description: Required. The [License Key](https://docs.melissa.com/melissa/license/license-information.html) issued by Melissa.
          schema:
            type: string
          example: "{REPLACE-WITH-YOUR-LICENSE-KEY}"
        - name: opt
          in: query
          description: |
            [Options](https://docs.melissa.com/cloud-api/global-name/global-name-reference-guide.html#options) - Pass in options you want to set for the request. Options are listed in the `OptionName:Parameter` format with multiple options delimited with a `,`.
            - `CorrectFirstName:< ON | OFF >` - `ON` will allow first name misspelling corrections. Default is `OFF`, preserve first name spellings; no correction allowed.
            - `GenderAggression:< Code or Name >` - Set how aggressively the service will attempt to genderize neutral first names. By default, Global Name will assign a value of “N” when attempting to genderize a first name that can easily be male or female, such as “Taylor,” “Chris,” or “Pat.” Using this property in conjunction with the GenderPopulation option, you can instruct the service on how much preference to give one gender over the other when assigning a gender to a normally neutral name.

              Either the `Code` or `Name` listed below can be used to set the action. For example, `GENDERAGGRESSION:2` and `GENDERAGGRESSION:Neutral` are equivalent.
              - `1` or `Aggressive` - Aggressive name genderizing.
              - `2` or `Neutral` - **Default**. Neutral name genderizing.
              - `3` or `Conservative` - Conservative name genderizing.
            - `GenderPopulation:< Code or Name >` - Set the gender balance of the source data, predominantly male, predominantly female, or neutral. If you know that the majority of inputted names will be predominantly one gender, meaning that gender-neutral names will likely be of a particular gender, use this property to set the gender bias while genderizing names.

              Either the `Code` or `Name` listed below can be used to set the action. For example, `GENDERPOPULATION:3` and `GENDERPOPULATION:Female` are equivalent settings.
              - `1` or `Male` - Bias towards Male.
              - `2` or `Mixed` - **Default**. No bias towards either gender.
              - `3` or `Female` - Bias towards Female.

            - `LegacySalutation:< ON | OFF >` - **US/CAN only**. This option will create a formal (Mr/Mrs) salutation from an assigned FirstName gender for US/CAN. Default is `OFF`.
            - `NameHint:< Code or Name >` - This option sets the most likely format of the FullName input string. This helps the service in cases where the order and formatting of the FullName input string are unclear.

              - Full or normal name order is: \<Prefix\> \<First\> \<Middle\> \<Last\> \<Suffix\>.
              - Inverse name order is: \<Last\> \<Suffix\>, \<Prefix\> \<First\> \<Middle\>.

              Either the `Code` or `Name` listed below can be used to set the action. For example, `NAMEHINT:4` and `NAMEHINT:Varying` are equivalent settings.
              - `1` or `DefinitelyFull` - Name will always be treated as normal name order regardless of formatting or punctuation.
              - `4` or `Varying` - **Default**. If necessary, statistical logic will be employed to determine name order, with no bias toward either name order.
              - `7` or `DefinitelyInverse` - Name will always be treated as inverse name order, regardless of formatting or punctuation.
            - `Salutation:< Formal | Informal | FirstLast | Slug | Blank >` - This option creates a pipe delimited list of preferred salutation formats and precedence to use when generating salutations. There are five possible formats to use for creating salutations. The options in default order are:
              1. `Formal` - (e.g., "Mr. Smith MD")
              2. `Informal` - (e.g., "John")
              3. `FirstLast` - (e.g., "John Smith")
              4. `Slug` - (e.g., "Valued Customer")
              5. `Blank` - (e.g., "")

              example: `opt=Salutation:Formal|FirstLast|Blank|Informal` - This requests a formal salutation to be built where possible but would rather have a blank salutation than an informal salutation (this could replace a blank with a proprietary slug like ‘Valued Customer:’).
            - `SalutationPrefix:<your-custom-prefix>` - Sets the prefix for the salutation name.
            - `SalutationSlug:<your-custom-slug>` - Sets the text for substituting a name in salutations.
            - `SalutationSuffix:<your-custom-suffix>` - Sets the suffix for the salutation name.
            - `StandardizeName:< ON | OFF >` - This option enables or disables standardization of First, Middle and Last names allowing the user to retain original casing or prevent complex last name prefix modifications (such as `St.` or `O'` name overrides.) Default is `ON`.
          schema:
            type: string
          example: "CorrectFirstName:ON,GenderAggression:2,Salutation:Formal|FirstLast|Blank|Informal"
        - name: format
          in: query
          description: Specify the desired format of the response (XML or JSON). Defaults to XML.
          schema:
            type: string
            enum:
              - xml
              - json
            default: "xml"
          example: "json"
        - name: comp
          in: query
          description: The company name to be standardized.
          schema:
            type: string
          example: "Melissa Data corp"
        - name: full
          in: query
          description: Required. The full name to be genderized, standardized, and parsed.
          required: true
          schema:
            type: string
          example: "Doktor Enna Schäfer"
        - name: ctry
          in: query
          description: The country name or abbreviation of the input name.
          schema:
            type: string
          example: "DE"
      responses:
        '200':
          description: Global Name Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/doGlobalNameResponse'
              examples:
                default:
                  summary: Example Default Response
                  value:
                    Version: "9.4.1.4127"
                    TransmissionReference: "Global Name Test"
                    TransmissionResults: ""
                    TotalRecords: "1"
                    Records:
                      - RecordID: "1"

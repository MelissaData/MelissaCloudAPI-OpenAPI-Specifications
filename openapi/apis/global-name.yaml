          example: "CorrectFirstName:ON,GenderAggression:2,Salutation:Formal|FirstLast|Blank|Informal"
        Format:
          type: string
          enum:
            - xml
            - json
          default: xml
          description: Specify the desired format of the response (XML or JSON). Defaults to XML.
        Records:
          type: array
          xml:
            wrapped: true
          description: Records array containing the records to be processed.
          items:
            type: object
            $ref: '#/components/schemas/doGlobalNameRequestRecord'
          minItems: 1
          maxItems: 100
    doGlobalNameRequestRecord:
      type: object
      xml:
        name: RequestRecord
      required:
        - FullName
      properties:
        RecordID:
          type: string
          description: This is a string value containing a unique identifier for the current record. Use this to match the record submitted with the record returned.
          example: "1"
        Company:
          type: string
          description: The company name to be standardized.
        Country:
          type: string
          description: The country name or abbreviation of the input name.
        FullName:
          type: string
          description: Required. The full name to be genderized, standardized, and parsed.
    doGlobalNameResponse:
      type: object
      xml:
        name: Response
      properties:
        Version:
          type: string
          description: The current service version number.
        TransmissionReference:
          type: string
          description: A unique identifier for this set of records. Returned as sent.
        TransmissionResults:
          type: string
          description: Returns result codes for the request as a whole. For more information, see [Global Name Result Codes](https://docs.melissa.com/cloud-api/global-name/result-codes.html).
        TotalRecords:
          type: string
          description: Total number of records.
        Records:
          type: array
          xml:
            wrapped: true
          description: Records array containing the results for each record processed.
          items:
            $ref: '#/components/schemas/doGlobalNameResponseRecords'
    doGlobalNameResponseRecords:
      type: object
      xml:
        name: ResponseRecord
      properties:
        RecordID:
          type: string
          description: A unique identifier for the current record if one was sent in the request. Use this element to match a request record and the corresponding response record.
        Results:
          type: string
          description: Comma delimited status, error codes, and change codes for the record. For more information, see [Global Name Result Codes](https://docs.melissa.com/cloud-api/global-name/result-codes.html).
        Company:
          type: string
          description: Standardized company name.
        NamePrefix:
          type: string
          description: First prefix (such as "Mr." or "Dr.") from an inputted full name.
        NameFirst:
          type: string
          description: First name from an inputted full name.
        NameMiddle:
          type: string
          description: Middle name from an inputted full name.
        NameLast:
          type: string
          description: Last name from an inputted full name.
        NameSuffix:
          type: string
          description: First suffix (such as “Jr.” or “III”) from an inputted full name.
        NameNickname:
          type: string
          description: Identified nickname from an inputted full name.
        NameProfTitle:
          type: string
          description: Professional title from an inputted full name.
        Gender:
          type: string
          description: One-character string value indicating the gender of the first name from the input.
        NamePrefix2:
          type: string
          description: Second prefix (such as “Mr.” or “Dr.”) from an inputted full name.
        NameFirst2:
          type: string
          description: Second first name from an inputted full name.
        NameMiddle2:
          type: string
          description: Second middle name from an inputted full name.
        NameLast2:
          type: string
          description: Second last name from an inputted full name.
        NameSuffix2:
          type: string
          description: Second suffix (such as “Jr.” or “III”) from an inputted full name.
        NameNickname2:
          type: string
          description: Second identified nickname from an inputted full name.
        NameProfTitle2:
          type: string
          description: Second professional title from an inputted full name.
        Gender2:
          type: string
          description: One-character string value indicating the gender of the second first name from the input.
        Salutation:
          type: string
          description: The response’s name properties from the inputted full name which can be used to create the desired salutation format.
        Extras:
          type: string
          description: This is a string value of the input words not associated with a parsed name part.
  responses:
    error:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: The type of error that occurred.
              title:
                type: string
                description: A short summary of the error.
              status:
                type: integer
                description: The HTTP status code for the error.
              errors:
                type: object
                properties:
                  $.<PropertyName>:
                    type: array
                    description: A detailed message about the error.
                    items:
                      type: string
              traceId:
                type: string
                description: A unique identifier for the request, useful for debugging.
                        NameFirst: "Enna"
                        NameMiddle: ""
                        NameLast: "Schäfer"
                        NameSuffix: ""
                        NameNickname: ""
                        NameProfTitle: "Doktor"
                        Gender: "F"
                        NamePrefix2: ""
                        NameFirst2: ""
                        NameMiddle2: ""
                        NameLast2: ""
                        NameSuffix2: ""
                        NameNickname2: ""
                        NameProfTitle2: ""
                        Gender2: ""
                        Salutation: ""
                        Extras: ""
            application/xml:
              example: |
                <Response
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xmlns:xsd="http://www.w3.org/2001/XMLSchema"
                  xmlns="urn:mdGlobalName">
                  <Version>7.4.1.4108</Version>
                  <TransmissionReference>Global Name CurlExample</TransmissionReference>
                  <TransmissionResults />
                  <TotalRecords>1</TotalRecords>
                  <Records>
                    <ResponseRecord>
                      <RecordID>1</RecordID>
                      <Results>NS01,NS05,NS06</Results>
                      <Company />
                      <NamePrefix>Doktor</NamePrefix>
                      <NameFirst>Enna</NameFirst>
                      <NameMiddle />
                      <NameLast>Schäfer</NameLast>
                      <NameSuffix />
                      <NameNickname />
                      <NameProfTitle />
                      <Gender>F</Gender>
                      <NamePrefix2 />
                      <NameFirst2 />
                      <NameMiddle2 />
                      <NameLast2 />
                      <NameSuffix2 />
                      <NameNickname2 />
                      <NameProfTitle2 />
                      <Gender2 />
                      <Salutation />
                      <Extras />
                    </ResponseRecord>
                  </Records>
                </Response>
              schema:
                $ref: '#/components/schemas/doGlobalNameResponse'
        '400':
          $ref: '#/components/responses/error'
    post:
      tags:
        - Name Verification
      summary: Verify names or companies
      description: |
        This is the Global Name request.

        **_Note:_** A License Key is required with either Company or FullName for this request.
      operationId: doGlobalNamePOST

markdown:
  toc:
    depth: 2
logo:
  image: "./images/melissa-developer-portal-logo.png"
  # srcSet: "./images/melissa-developer-logo-light.svg light, ./images/melissa-developer-logo-dark.svg dark"
  altText: Melissa logo
  favicon: ./images/Melissa-favicon.png
  link: /
footer:
  copyrightText: © 2025 Melissa Data Corporation. All rights reserved.
  items:
  - group: Connect
    items:
      - href: https://www.melissa.com
        label: Visit Melissa
      - href: https://github.com/MelissaData?tab=repositories
        label: GitHub
      - href: https://www.instagram.com/melissadatacorp/
        label: Instagram
  - group: Support
    items:
      - href: https://docs.melissa.com/melissa/license/license-information.html
        label: Melissa License Key
      - href: https://docs.melissa.com
        label: Documentation
      - href: https://www.melissa.com/company/contact
        label: Contact Us

mockServer:
  off: true

breadcrumbs:
  hide: false
  prefixItems:
    - page: index.page.tsx
      label: Home
      labelTranslationKey: home.title
      icon: home

openapi:
  codeSamples:
    skipOptionalParameters: true
    languages:
      - lang: 'curl'
      - lang: 'C#'
      - lang: 'Python'
      - lang: 'Java'
      - lang: 'JavaScript'
      - lang: 'Node.js'
      - lang: 'PHP'
      - lang: 'Go'
      - lang: 'Ruby'
      - lang: 'R'
      - lang: 'C#+Newtonsoft'
      - lang: 'Java8+Apache'
      - lang: 'Payload'
